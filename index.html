<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanzas</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f5f5f7; --side:rgba(246,246,248,.82); --card:#ffffff; --text:#1d1d1f; --muted:#86868b; --line:rgba(60,60,67,.12);
    --fill:rgba(120,120,128,.10); --accent:#ff5a52; --accent-soft:rgba(255,90,82,.12); --segon:#ffffff;
    --green:#30b455; --orange:#ff9f0a; --blue:#0a84ff; --purple:#af52de; --red:#ff453a; --dark:#1d1d1f;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04); --overlay:rgba(0,0,0,.32);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#000; --side:rgba(28,28,30,.82); --card:#1c1c1e; --text:#f5f5f7; --muted:#98989f; --line:rgba(84,84,88,.5);
      --fill:rgba(120,120,128,.22); --accent:#ff6b63; --accent-soft:rgba(255,107,99,.16); --dark:#f5f5f7; --shadow:none; --overlay:rgba(0,0,0,.6); --segon:#636366; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.011em;font-size:14px}
  button,input,select{font:inherit;color:inherit}
  .layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

  /* Sidebar */
  aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-weight:700;font-size:18px;letter-spacing:-.02em}
  .nav-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 10px 6px;margin-top:16px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;text-align:left;transition:background .15s}
  .nav button:hover{background:var(--fill)}
  .nav button.on{background:var(--accent);color:#fff}
  .nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .side-foot{margin-top:auto;padding:10px 6px 0;display:flex;gap:8px}
  .side-foot button{flex:1;border:0;background:var(--fill);border-radius:9px;padding:8px;font-size:12.5px;font-weight:500;cursor:pointer}

  /* Main */
  main{padding:0 36px 60px;min-width:0}
  .toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:18px 0 14px;background:var(--bg)}
  .toolbar h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em;flex:1}
  .seg{display:flex;align-items:center;background:var(--fill);border-radius:10px;padding:3px}
  .seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-weight:500}
  .seg .mname{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize;padding:5px 8px;cursor:default}
  .seg button:hover{background:var(--card)}
  .btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:transform .12s,opacity .12s;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-dark{background:var(--dark);color:var(--bg)}
  .btn-soft{background:var(--fill)}
  .btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}

  /* Cards & grids */
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
  .card h3{margin:0 0 14px;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card h3 span{font-weight:400;color:var(--muted);font-size:12.5px}
  .grid{display:grid;gap:16px;margin-bottom:16px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .g5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .split32{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
  .kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
  .kpi .v{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
  .pos{color:var(--green)} .neg{color:var(--red)} .neu{color:var(--blue)}
  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:28px 30px;background:linear-gradient(135deg,#ff6a5c,#ff453a);color:#fff;border-radius:22px;margin-bottom:16px;box-shadow:0 14px 40px rgba(255,69,58,.28)}
  .hero .l{font-size:13.5px;opacity:.85;font-weight:500}
  .hero .big{font-size:clamp(44px,5.4vw,72px);font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
  .hero .big small{font-size:.4em;font-weight:500;opacity:.8;margin-right:6px}
  .hero .side{text-align:right;font-size:13px;opacity:.95;max-width:430px}
  .hero .btn{background:rgba(255,255,255,.22);color:#fff;margin-top:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .kv:first-of-type{border-top:0}
  .kv span{color:var(--muted)} .kv b{font-variant-numeric:tabular-nums;text-align:right}
  .nwbig{font-size:30px;font-weight:700;letter-spacing:-.035em;margin:0 0 10px;font-variant-numeric:tabular-nums}

  /* Panel principal */
  .alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .alert{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border-left:4px solid var(--orange);font-size:13.5px;line-height:1.45}
  .alert.bad{border-left-color:var(--red)}
  .alert .ai{font-size:16px;flex:none}
  .alert .at{flex:1}
  .alert a,.kpi .nodata a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap;font-size:13px}
  .kpi.big .v{font-size:30px}
  .kpi .cmp{font-size:12.5px;font-weight:600;margin-top:8px}
  .kpi .mini{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
  .kpi .mini div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;color:var(--muted)}
  .kpi .mini b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpi .nodata{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.45}
  .kpi .v.dim{color:var(--muted)}
  .muted{color:var(--muted)} .warnc{color:#d98200}
  .hero .hbox{text-align:left;max-width:none;min-width:310px;opacity:1}
  .hrow{display:flex;justify-content:space-between;gap:28px;padding:3px 0}
  .hrow b{font-variant-numeric:tabular-nums}
  .hero .hrow.tot{border-top:1px solid rgba(255,255,255,.35);margin-top:5px;padding-top:7px}
  .due{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
  .due:first-of-type{border-top:0}
  .due .dd{width:52px;flex:none;text-align:center;border-radius:10px;background:var(--fill);padding:6px 0;line-height:1.15}
  .due .dd b{display:block;font-size:17px}
  .due .dd span{font-size:11px;color:var(--muted);text-transform:uppercase}
  .due .dn{flex:1;min-width:0}
  .due .dn b{display:block;font-weight:600}
  .due .dn small{color:var(--muted);font-size:12.5px}
  .due .da{font-weight:600;font-variant-numeric:tabular-nums}

  /* Table */
  table{width:100%;border-collapse:collapse}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:0 10px 10px}
  td{padding:12px 10px;border-top:1px solid var(--line)}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.act{width:84px;text-align:right;white-space:nowrap}
  .ico-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:13px}
  .ico-btn:hover{background:var(--fill);color:var(--text)}
  .tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--fill)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.ok{background:rgba(48,180,85,.15);color:var(--green)}
  .pill.warn{background:rgba(255,159,10,.17);color:#d98200}
  .pill.bad{background:rgba(255,69,58,.14);color:var(--red)}
  .pill.info{background:rgba(10,132,255,.14);color:var(--blue)}
  .scroll{max-height:380px;overflow-y:auto;margin-right:-8px;padding-right:8px;scrollbar-width:thin;scrollbar-color:rgba(120,120,128,.4) transparent}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(120,120,128,.4);border-radius:99px}
  .scroll tr:first-child td{border-top:0}
  .empty{text-align:center;color:var(--muted);padding:34px 10px}
  .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

  /* Bars & charts */
  .hb{margin:12px 0}
  .hb .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .hb .track{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
  .hb .fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:170px}
  .legend div{display:flex;align-items:center;gap:9px;font-size:13px}
  .legend i{width:10px;height:10px;border-radius:50%;flex:none}
  .legend b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
  .legend em{color:var(--muted);font-style:normal;font-size:12px;width:38px;text-align:right}
  .donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .donutwrap svg{width:190px;height:190px;flex:none}
  .chartbox{width:100%}
  .chart{width:100%;height:100%;display:block}
  .chart text{fill:var(--muted);font-size:11px}
  .chart .gl{stroke:var(--line)}
  .key{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px}
  .key i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

  /* Fixed list */
  .fx{display:flex;align-items:center;gap:14px;padding:13px 4px;border-top:1px solid var(--line)}
  .fx:first-child{border-top:0}
  .chk{width:26px;height:26px;border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center;flex:none;transition:.2s;padding:0;border:2px solid rgba(120,120,128,.4)}
  .chk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.2s}
  .chk.on{background:var(--green);border-color:var(--green)}
  .chk.on svg{opacity:1;transform:scale(1)}
  .fx .n{flex:1;font-weight:500}
  .fx .n small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  .fx.done .n b{text-decoration:line-through;color:var(--muted);font-weight:500}
  .fx .a{font-variant-numeric:tabular-nums;font-weight:600}
  .progress{height:10px;border-radius:99px;background:var(--fill);overflow:hidden}
  .progress>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#ff7a6b,#ff453a);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .progress.green>div{background:linear-gradient(90deg,#5fd37f,#30b455)}

  /* Loans */
  .loans{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
  .loan h4{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
  .loan .sub{color:var(--muted);font-size:12.5px}
  .loan .meta,.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:16px 0}
  .meta div span{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
  .meta div b{font-size:15px;font-variant-numeric:tabular-nums}
  .plabel{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .loan .split{display:flex;gap:6px;margin:14px 0;font-size:12px}
  .loan .split div{flex:1;background:var(--fill);border-radius:10px;padding:8px 10px}
  .loan .split span{display:block;color:var(--muted);font-size:11px}
  .btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .loan.wide{grid-column:1/-1}
  .ptbl{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
  .ptbl th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;vertical-align:bottom}
  .ptbl td{padding:10px 8px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
  .ptbl th:first-child,.ptbl td:first-child{text-align:left}
  .ptbl td small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;font-weight:500}
  .ptbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
  .ptbl tr.cl td{opacity:.7}
  .pflags{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .pflag{padding:11px 14px;border-radius:12px;background:rgba(255,159,10,.14);font-size:13px;line-height:1.5}
  .pflag.info{background:var(--fill)}
  .eq{display:grid;grid-template-columns:1fr auto;gap:0 18px}
  .eq .kv{display:contents}
  .eq .sub{grid-column:1/-1;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px}
  .eq .tot{font-weight:700}
  .eq .kv span,.eq .kv b{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
  .eq .sub+.kv span,.eq .sub+.kv b{border-top:0}
  .loan .rate{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}
  .sim{margin-top:16px;border-top:1px solid var(--line);padding-top:16px}
  .sim h5{margin:0 0 10px;font-size:15px;letter-spacing:-.01em}
  .simb{padding:11px 14px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:12px;background:var(--fill)}
  .simb.warn{background:rgba(255,159,10,.14)} .simb.ok{background:rgba(48,180,85,.14)}
  .simdata{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 18px;margin:0 0 12px}
  .simdata span{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
  .simdata b{font-size:13.5px;font-weight:600}
  .simin{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0 8px}
  .simin label{font-size:12px;font-weight:600;color:var(--muted)}
  .simin input{display:block;width:100%;margin-top:6px;border:1.5px solid transparent;background:var(--fill);border-radius:10px;padding:10px 12px;font-size:15px;outline:0;color:var(--text);font-variant-numeric:tabular-nums}
  .simin input:focus{border-color:var(--accent)}
  .simchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .simerr{background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:8px}
  .simtbl{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
  .simtbl th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;vertical-align:bottom}
  .simtbl th:first-child,.simtbl td:first-child{text-align:left}
  .simtbl td{padding:8px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .simtbl td:first-child{color:var(--muted)}
  .simtbl tr.sv td{font-weight:700;color:var(--green)}
  .simtbl tr.pick{cursor:pointer} .simtbl tr.pick:hover td{background:var(--fill)} .simtbl tr.pick.on td{background:var(--accent-soft)}
  .simtbl em.unc{display:block;font-style:normal;font-weight:500;color:var(--orange);font-size:11px}
  .simtbl .d{color:var(--green);font-size:11.5px;display:block}
  .simfoot{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
  .sim details{margin-top:12px;font-size:12.5px;line-height:1.55;color:var(--muted)}
  .sim details summary{cursor:pointer;font-weight:600;color:var(--text)}
  .hist{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
  .hist table td{padding:8px 6px;font-size:12.5px}

  /* Metas / bolsillos / inversiones */
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px;gap:10px;flex-wrap:wrap}
  .sec-head h3{margin:0;font-size:17px}
  .pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;margin-bottom:20px}
  .pot{display:flex;flex-direction:column}
  .pot .ph{display:flex;align-items:flex-start;gap:12px}
  .pot .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none}
  .pot .pt{flex:1;min-width:0}
  .pot h4{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pot .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .pot .bal{font-size:28px;font-weight:700;letter-spacing:-.035em;margin-top:16px;font-variant-numeric:tabular-nums}
  .pot .of{color:var(--muted);font-size:13px;margin:2px 0 12px}
  .pot .pinfo{margin:14px 0 4px;display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted)}
  .pot .pinfo b{color:var(--text);font-weight:600}
  .pot .btns{margin-top:auto;padding-top:14px}
  .pot.done{box-shadow:0 0 0 1.5px rgba(48,180,85,.5),var(--shadow)}
  .pot.closed{opacity:.7}
  .ins{display:flex;gap:10px;padding:11px 12px;border-radius:12px;background:var(--fill);margin-bottom:8px;font-size:13px;line-height:1.45}
  .ins i{font-style:normal;flex:none}
  .brk{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .brk:first-of-type{border-top:0}
  .brk .bt{flex:1;min-width:0}
  .brk .bt b{display:block}
  .brk .bt small{color:var(--muted);display:block;font-size:12.5px;line-height:1.4;margin-top:2px}
  details.card summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.card summary::-webkit-details-marker{display:none}
  details.card summary::after{content:"＋";color:var(--muted)}
  details.card[open] summary::after{content:"－"}
  details.card .body{margin-top:14px;font-size:13.5px;line-height:1.55}
  details.card .body ul{margin:6px 0 14px;padding-left:20px}
  details.card .body li{margin:4px 0}
  details.card .body h5{margin:14px 0 4px;font-size:13.5px}
  .note{color:var(--muted);font-size:12.5px;line-height:1.5}

  /* Modal */
  .overlay{position:fixed;inset:0;background:var(--overlay);display:none;place-items:center;z-index:50;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .overlay.open{display:grid}
  .modal{width:min(480px,92vw);max-height:92vh;overflow:auto;background:var(--card);border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
  .modal h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
  .modal .desc{margin:0 0 18px;color:var(--muted);font-size:13px}
  .modal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px}
  .modal input,.modal select{display:block;width:100%;margin-top:6px;border:1.5px solid transparent;background-color:var(--fill);border-radius:10px;padding:11px 12px;font-size:15px;outline:0;color:var(--text);transition:border-color .15s}
  .modal input:focus,.modal select:focus{border-color:var(--accent)}

<script>
(() => {
'use strict';
const KEY = 'finanzas.pc.v1';
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-CO', {maximumFractionDigits:0});
const fmt = n => nf.format(Math.round(n));
const money = n => (n < 0 ? '− ' : '') + '$ ' + fmt(Math.abs(n));
const usd = n => 'US$ ' + new Intl.NumberFormat('en-US', {maximumFractionDigits:2}).format(n);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = ymd(new Date());
const todayKey = todayStr.slice(0,7);
const shift = (k, d) => { const [y,m] = k.split('-').map(Number); const t = new Date(y, m-1+d, 1); return `${t.getFullYear()}-${pad(t.getMonth()+1)}`; };
const monthName = (k, short) => { const [y,m] = k.split('-').map(Number); return new Intl.DateTimeFormat('es-CO', short ? {month:'short'} : {month:'long', year:'numeric'}).format(new Date(y, m-1, 1)).replace('.',''); };
const dShort = s => { const [y,m,d] = s.split('-').map(Number); return new Intl.DateTimeFormat('es-CO', {day:'numeric', month:'short'}).format(new Date(y, m-1, d)).replace('.',''); };
const dFull = s => { const [y,m,d] = s.split('-').map(Number); return new Intl.DateTimeFormat('es-CO', {day:'numeric', month:'short', year:'numeric'}).format(new Date(y, m-1, d)).replace(/\./g,''); };
const daysIn = k => { const [y,m] = k.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthEnd = k => `${k}-${pad(daysIn(k))}`;
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); return ymd(new Date(y, m-1, d+n)); };
const diffDays = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 864e5);
const abbr = n => n >= 1e6 ? (n/1e6).toFixed(n%1e6 ? 1 : 0)+'M' : n >= 1e3 ? Math.round(n/1e3)+'k' : String(Math.round(n));
const sum = (a, f) => a.reduce((t, x) => t + (f ? f(x) : x.amount), 0);
const byDate = (a, b) => a.date.localeCompare(b.date);
const dec1 = n => n.toFixed(1).replace('.', ',');

/* ---------- Datos ---------- */
const blank = () => ({ months:{}, extras:[], rides:[], expenses:[], fixed:[], fixedPaid:{}, loans:[], pots:[], invest:[], brokers:[], settings:{trm:0, trmDate:''} });

  s.extras.forEach(x => { if (LEGACY[x.type]){ x.desc = LEGACY[x.type] + (x.desc ? ' · ' + x.desc : ''); x.type = 'otro'; } });
  return s;
}
let S;
S = normalize(null); /* los datos viven en la nube (Firestore); se cargan al abrir */
const save = () => cloud.mark();
const ui = { view:'resumen', month:todayKey, hist:{}, sim:{} };

const SOURCES = [
  ['independiente','Trabajo independiente','💼','#0a84ff'],

];

const CATS = ['Comida','Transporte','Personal','Hogar','Ocio','Salud','Educación','Otro'];
const CAT_COL = ['#ff9f0a','#0a84ff','#ff5a52','#30b455','#af52de','#ff6b9d','#32ade6','#8e8e93'];
const ICONS = [['✈️','Viaje'],['🏍️','Moto'],['🚗','Carro'],['🎓','Estudio'],['🏠','Vivienda'],['💻','Tecnología'],['🎁','Regalo'],['🛟','Salvavidas / emergencia'],['🗓️','Gastos de la semana'],['🎉','Ocio'],['💍','Evento'],['🐶','Mascota'],['🧰','Negocio'],['🎯','Otro objetivo']];
const POT_COL = ['#ff5a52','#0a84ff','#30b455','#af52de','#ff9f0a','#32ade6','#ff6b9d','#5e5ce6'];
const TEMPLATES = {
  meta:[['✈️','Viaje'],['🏍️','Moto'],['🚗','Carro'],['🎓','Estudio'],['🏠','Vivienda'],['💻','Computador']],
  bolsillo:[['🛟','Fondo de emergencia'],['🗓️','Gastos de la semana'],['🎉','Ocio'],['🎯','Imprevistos']],
};
const isEmergency = p => p.icon === '🛟';
const ITYPES = {
  cdt:['CDT','🏦','#0a84ff'],
  fic:['Fondo de inversión (FIC)','📊','#30b455'],
  ahorro:['Cuenta o bolsillo remunerado','🐷','#ff6b9d'],
  bolsa:['Acciones y ETFs','📈','#af52de'],
  usd:['Dólares','💵','#ff9f0a'],
  otro:['Otra inversión','🧩','#8e8e93'],
};
const PLATFORMS = ['Nu','Nequi','Lulo','Bancolombia','Davivienda','Bold','Pibank','KOA','Trii','Hapi','Dólar App','Interactive Brokers','eToro','XTB','ARQ','Fiduciaria'];
const RET = 0.04; // retención en la fuente sobre intereses de CDT
const BROKER_CAT = [
  ['Trii','Acciones colombianas (BVC)','Sin mínimo; vigilada por la SFC. Sirve para empezar con montos pequeños.'],
  ['Hapi','Acciones y ETFs de EE. UU.','$0 de comisión y $0 de mínimo; regulación SEC vía Alpaca. Interfaz en español.'],
  ['Interactive Brokers','Acciones, ETFs, bonos y más en +150 mercados','$0 de mínimo; $0 en acciones y ETFs de EE. UU. con IBKR Lite. Más completo, pero más complejo.'],
  ['eToro','Acciones, ETFs, cripto y CFDs','Depósito inicial de ≈ US$200. Evita los CFDs mientras estés aprendiendo.'],
  ['XTB','Acciones, ETFs y CFDs','Sin mínimo; $0 de comisión hasta 100.000 EUR al mes. Los CFDs apalancados pueden perder más de lo invertido.'],
  ['ARQ','BVC, fondos de inversión y acciones internacionales','Vigilada por la SFC; ofrece asesoría y portafolios diversificados.'],
  ['Dólar App','Compra y ahorro de dólares','No pude verificar sus condiciones: revisa supervisión, comisiones y cómo retirar antes de depositar.'],
];
const STATUS = {evaluar:['Por evaluar','info'], abierta:['Cuenta abierta','ok'], descartada:['Descartada','bad']};

/* ---------- Cálculos ---------- */
const inM = (a, k) => a.filter(x => x.date.slice(0,7) === k);
const rideNet = r => (r.gross || 0) - (r.fuel || 0);
const payTotal = p => (p.capital||0) + (p.interest||0) + (p.insurance||0);

function stats(k){
  const ex = inM(S.extras, k), rd = inM(S.rides, k), gx = inM(S.expenses, k);
  const fp = S.fixedPaid[k] || {};
  const fixedT = sum(Object.values(fp));
  const pays = S.loans.flatMap(l => l.payments.filter(p => p.date.slice(0,7) === k).map(p => ({...p, loan:l.name})));
  const potTx = S.pots.flatMap(p => p.tx.filter(t => !t.ext && t.date.slice(0,7) === k).map(t => ({...t, pot:p})));
  const invTx = S.invest.flatMap(h => h.tx.filter(t => !t.ext && t.op !== 'valor' && t.date.slice(0,7) === k).map(t => ({...t, h})));
  const potIn = sum(potTx.filter(t => t.amount > 0), t => t.amount), potOut = -sum(potTx.filter(t => t.amount < 0), t => t.amount);
  const invIn = sum(invTx.filter(t => t.op === 'aporte'), t => t.amount), invOut = sum(invTx.filter(t => t.op === 'retiro'), t => t.amount);
  const extrasT = sum(ex), gross = sum(rd, r => r.gross), fuel = sum(rd, r => r.fuel), net = gross - fuel;
  const expT = sum(gx), loanT = sum(pays, payTotal);
  const income = extrasT + net, out = expT + fixedT + loanT;
  const alloc = potIn + invIn - potOut - invOut;
  return { ex, rd, gx, fp, pays, potTx, invTx, potIn, potOut, invIn, invOut, alloc, extrasT, gross, fuel, net, expT, fixedT, loanT, income, out, flow: income - out - alloc };
}
function allMonths(){
  const set = new Set(Object.keys(S.months).filter(k => S.months[k].initial != null));
  [...S.extras, ...S.rides, ...S.expenses].forEach(x => set.add(x.date.slice(0,7)));
  Object.keys(S.fixedPaid).forEach(k => Object.keys(S.fixedPaid[k]).length && set.add(k));
  S.loans.forEach(l => l.payments.forEach(p => set.add(p.date.slice(0,7))));
  S.pots.forEach(p => p.tx.forEach(t => !t.ext && set.add(t.date.slice(0,7))));
  S.invest.forEach(h => h.tx.forEach(t => !t.ext && t.op !== 'valor' && set.add(t.date.slice(0,7))));
  return [...set].sort();
}
function initialOf(k){
  const m = S.months[k];
  if (m && m.initial != null) return { v:m.initial, src:'manual' };
  if (!allMonths().some(x => x < k)) return { v:0, src:'zero' };
  return { v:finalOf(shift(k,-1)), src:'carry' };
}
function finalOf(k){ return initialOf(k).v + stats(k).flow; }

function loanInfo(l, asOf){
  const pays = asOf ? l.payments.filter(p => p.date <= asOf) : l.payments;
  const capital = (l.priorCapital||0) + sum(pays, p => p.capital||0);
  const interest = sum(pays, p => p.interest||0);
  const insurance = sum(pays, p => p.insurance||0);
  const paidFees = (l.priorPaid||0) + pays.filter(p => p.kind === 'cuota').length;
  const left = Math.max(0, l.term - paidFees);
  const balance = Math.max(0, l.principal - capital);
  return { capital, interest, insurance, paidFees, left, balance, toPay:left * l.fee, pct: l.principal ? Math.min(100, capital / l.principal * 100) : 0 };
}

/* ---------- Simulador de abonos a capital (Fase 5) ---------- */
/* SIM:START */
const SIM_MAX_N = 600;
const dec2 = n => n.toFixed(2).replace('.', ',');
const pc = (m, d) => (m * 100).toFixed(d == null ? 2 : d).replace('.', ',') + '%';
const eaOf = m => (Math.pow(1 + m, 12) - 1) * 100;
const loanRate = l => {
  const r = Number(l.rate) || 0;
  if (l.rateType === 'ea' && r > 0) return { m:Math.pow(1 + r/100, 1/12) - 1, kind:'ea', input:r };
  if (l.rateType === 'mv' && r > 0) return { m:r/100, kind:'mv', input:r };
  if (l.rateType === 'cero') return { m:0, kind:'cero', input:0 };
  return null;
};
/* Tasa mensual i tal que B = c·(1−(1+i)^−n)/i  (valor presente de n cuotas c). null si los datos no cuadran. */
function impliedRate(B, c, n){
  if (!(B > 0) || !(c > 0) || !(n > 0)) return null;
  const f = i => i === 0 ? c*n - B : c*(1 - Math.pow(1 + i, -n))/i - B;
  if (f(0) < -0.5) return null;
  if (f(0) <= 0.5) return 0;
  let lo = 0, hi = 1;
  if (f(hi) > 0) return null;
  for (let k = 0; k < 100; k++){ const mid = (lo + hi)/2; if (f(mid) > 0) lo = mid; else hi = mid; }
  return (lo + hi)/2;
}
/* Interés pagado ÷ saldo previo, en el último pago de cuota con interés registrado (solo informativo). */
function observedRate(l){
  const ps = l.payments.map((p, ix) => ({p, ix})).sort((a, b) => a.p.date.localeCompare(b.p.date) || a.ix - b.ix);
  let cap = l.priorCapital || 0, res = null;
  for (const {p} of ps){
    const bal = l.principal - cap;
    if (p.kind === 'cuota' && (p.interest || 0) > 0 && bal > 0) res = { m:p.interest / bal, date:p.date };
    cap += p.capital || 0;
  }
  return res;
}
/* Cuota fija c (capital + interés) mensual hasta saldar B. Última cuota = lo que falte. */
function amort(B, i, c){
  if (!(B > 0)) return { ok:true, n:0, cap:0, int:0 };
  if (!(c > 0) || c <= B*i + 1e-6) return { ok:false, why:'cuota' };
  let bal = B, n = 0, int = 0, cap = 0;
  while (bal > 0.5 && n < SIM_MAX_N){
    const it = bal*i, pay = Math.min(c, bal + it);
    bal = bal + it - pay; int += it; cap += pay - it; n++;
  }
  if (bal > 0.5) return { ok:false, why:'plazo' };
  return { ok:true, n, cap, int };
}
function simPlan(l, asOf){
  const info = loanInfo(l, asOf), B = info.balance, fee = l.fee || 0;
  const ins = Math.min(Math.max(l.ins || 0, 0), fee);
  const P = { info, B, fee, ins, c:fee - ins, left:info.left, system:l.system === 'otro' ? 'otro' : 'fija', adm:l.adm || '?', mode:'balance', rate:null, base:null, missing:[], notes:[] };
  if (B <= 0){ P.mode = 'paid'; return P; }
  if (P.system === 'otro'){ P.notes.push('Tu préstamo no usa cuota fija, y el simulador solo sabe calcular cuota fija.'); return P; }
  const reg = loanRate(l);
  if (!(fee > 0)) P.missing.push('la cuota mensual');
  if (reg) P.rate = { ...reg, src:'registrada' };
  else {
    P.missing.push('la tasa de interés');
    if (fee > 0){
      if (!(info.left > 0)) P.missing.push('las cuotas restantes (el registro indica 0, pero aún hay saldo)');
      else {
        const m = impliedRate(B, P.c, info.left);
        if (m === null) P.notes.push('Con tu cuota y tus cuotas restantes no se alcanza a pagar el saldo: revisa esos datos.');
        else P.rate = { m, kind:'implicita', src:'implícita' };
      }
    }
  }
  if (P.rate && fee > 0){
    const b = amort(B, P.rate.m, P.c);
    if (!b.ok) P.notes.push(b.why === 'cuota' ? 'Con esta tasa, la cuota (sin seguro) no cubre los intereses: la deuda no bajaría.' : 'Con estos datos la deuda tardaría más de 50 años en pagarse.');
    else {
      P.base = { ...b, ins:P.ins*b.n }; P.base.total = b.cap + b.int + P.base.ins;
      P.mode = reg ? 'full' : 'limited';
      if (reg && Math.abs(b.n - info.left) >= 1) P.notes.push(`Con tu tasa y tu cuota, el saldo se paga en ${b.n} cuotas, pero tu registro indica ${info.left}. Revisa la tasa, el seguro o las cuotas pagadas.`);
    }
  }
  return P;
}
function simScenario(P, A){
  const B2 = Math.max(0, P.B - A), liquid = B2 <= 0.5;
  const out = { A, B2:liquid ? 0 : B2, liquid, plazo:null, cuota:null };
  if (P.mode !== 'full' && P.mode !== 'limited') return out;
  const i = P.rate.m, b = P.base;
  const mk = (n, int, c) => { const ins = P.ins*n, total = A + out.B2 + int + ins; return { n, int, ins, c, ctot:n ? c + P.ins : 0, total, dInt:b.int - int, dIns:b.ins - ins, dN:b.n - n, dTotal:b.total - total }; };
  if (liquid){ out.plazo = mk(0, 0, 0); out.cuota = mk(0, 0, 0); return out; }
  const p = amort(out.B2, i, P.c);
  if (p.ok) out.plazo = mk(p.n, p.int, P.c);
  const n0 = b.n, c2 = i > 0 ? out.B2*i / (1 - Math.pow(1 + i, -n0)) : out.B2 / n0;
  out.cuota = mk(n0, c2*n0 - out.B2, c2);
  return out;
}
function simCheck(raw, B){
  const s = String(raw == null ? '' : raw).trim();
  if (s === '') return { state:'empty' };
  if (/^-/.test(s)) return { state:'err', msg:'No puede ser negativo.' };
  const A = parseMoney(s);
  if (!(A > 0)) return { state:'err', msg:'Debe ser mayor a 0.' };
  if (A > B) return { state:'err', msg:`Supera el saldo pendiente (${money(B)}).` };
  return { state:'ok', A };
}
/* SIM:END */

/* Metas y bolsillos */
function potInfo(p){
  const tx = [...p.tx].sort(byDate);
  const bal = sum(tx, t => t.amount);
  const tgt = p.target || 0;
  const pct = tgt ? Math.min(100, Math.max(0, bal / tgt * 100)) : 0;
  const done = p.kind === 'meta' && tgt > 0 && bal >= tgt;
  let doneOn = null;
  if (done){ let c = 0; for (const t of tx){ c += t.amount; if (c >= tgt){ doneOn = t.date; break; } } }
  const rem = Math.max(0, tgt - bal);
  let pace = 0;
  for (let n = 0; n < 3; n++){ const k = shift(todayKey, -n); pace += sum(tx.filter(t => !t.opening && t.date.slice(0,7) === k), t => t.amount); }
  pace /= 3;
  const eta = (!done && tgt && rem > 0 && pace > 0) ? shift(todayKey, Math.ceil(rem / pace)) : null;
  let need = null, mleft = 0, overdue = false;
  if (!done && tgt && p.deadline){
    const [y,m] = p.deadline.split('-').map(Number), [ty,tm] = todayKey.split('-').map(Number);
    mleft = Math.max(1, (y-ty)*12 + (m-tm) + 1); need = rem / mleft; overdue = p.deadline < todayStr;
  }
  const late = !!(eta && p.deadline && eta > p.deadline.slice(0,7));
  return { bal, tgt, pct, done, doneOn, rem, pace, eta, need, mleft, overdue, late };
}
function avgExpense(){
  let t = 0, n = 0;
  for (let i = 0; i < 3; i++){ const o = stats(shift(todayKey, -i)).out; if (o > 0){ t += o; n++; } }
  return n ? t / n : 0;
}
const emergencyBal = () => sum(S.pots.filter(isEmergency), p => sum(p.tx, t => t.amount));

/* Inversiones */
function invInfo(h, asOf = todayStr){
  const tx = h.tx.filter(t => t.date <= asOf).sort(byDate);
  const ap = tx.filter(t => t.op === 'aporte'), rt = tx.filter(t => t.op === 'retiro'), vl = tx.filter(t => t.op === 'valor');
  const contributed = sum(ap, t => t.amount), withdrawn = sum(rt, t => t.amount);
  const o = { contributed, withdrawn, net: contributed - withdrawn, isUSD: h.currency === 'USD' };
  const lastV = vl[vl.length - 1];
  if (h.type === 'cdt'){
    const start = h.start || (ap[0] && ap[0].date) || asOf, term = h.term || 0, r = (h.rate || 0) / 100;
    const end = term ? addDays(start, term) : null;
    const upto = end && asOf > end ? end : asOf;
    let accrued = 0;
    ap.forEach(t => { accrued += t.amount * Math.pow(1 + r, Math.max(0, diffDays(t.date, upto)) / 365); });
    o.value = Math.max(0, accrued - withdrawn);
    const finalGross = term ? contributed * Math.pow(1 + r, term / 365) : contributed;
    Object.assign(o, { start, end, term, rate:h.rate || 0, finalGross, finalNet: contributed + (finalGross - contributed) * (1 - RET),
      daysLeft: end ? diffDays(asOf, end) : null, matured: !!end && asOf >= end,
      elapsed: term ? Math.min(100, Math.max(0, diffDays(start, asOf) / term * 100)) : 0 });
  } else if (o.isUSD){
    const after = lastV ? tx.filter(t => t.date > lastV.date) : tx;
    let units = (lastV ? lastV.value : 0) + sum(after.filter(t => t.op === 'aporte'), t => t.usd || 0) - sum(after.filter(t => t.op === 'retiro'), t => t.usd || 0);
    o.units = Math.max(0, units);
    const cUSD = sum(ap, t => t.usd || 0);
    o.trmAssumed = !(S.settings.trm > 0);
    o.trm = !o.trmAssumed ? S.settings.trm : (cUSD ? contributed / cUSD : 0);
    o.value = o.units * o.trm;
  } else {
    const after = lastV ? tx.filter(t => t.date > lastV.date) : [];
    o.value = Math.max(0, lastV
      ? lastV.value + sum(after.filter(t => t.op === 'aporte'), t => t.amount) - sum(after.filter(t => t.op === 'retiro'), t => t.amount)
      : contributed - withdrawn);
  }
  o.gain = o.value + withdrawn - contributed;
  o.pct = contributed ? o.gain / contributed * 100 : 0;
  o.closed = withdrawn > 0 && o.value < 1;
  return o;
}

/* ---------- Panel principal (Fase 2) ---------- */
const UPCOMING_DAYS = 15;      // ventana de "próximos pagos" para el mes en curso
const ALERT_EXP_GROWTH = 0.20; // alerta si los gastos superan en 20% o más al mes anterior
const asOfOf = k => k === todayKey ? todayStr : monthEnd(k);
const potBalAt = (p, asOf) => sum(p.tx.filter(t => t.date <= asOf), t => t.amount);

function networth(k){
  const asOf = asOfOf(k);
  const disp = finalOf(k);
  const metas = sum(S.pots.filter(p => p.kind === 'meta'), p => potBalAt(p, asOf));
  const bols = sum(S.pots.filter(p => p.kind !== 'meta'), p => potBalAt(p, asOf));
  const pots = metas + bols;
  const inv = sum(S.invest, h => invInfo(h, asOf).value);
  const debt = sum(S.loans, l => loanInfo(l, asOf).balance);
  return { disp, metas, bols, pots, inv, debt, assets: disp + pots + inv, total: disp + pots + inv - debt };
}
/* ---------- Patrimonio e inversiones (Fase 7) ---------- */
/* PF:START */
const STALE_DAYS = 30; // un valor registrado a mano se considera desactualizado después de estos días
const ageText = d => d == null ? '' : d <= 0 ? 'hoy' : d === 1 ? 'ayer' : d < 60 ? `hace ${d} días` : `hace ${Math.round(d/30)} meses`;
/* Origen y vigencia del valor de una inversión: nunca se presenta un dato manual viejo como cotización actual. */
function invMeta(h, i, asOf){
  const tx = h.tx.filter(t => t.date <= asOf).sort(byDate);
  const vl = tx.filter(t => t.op === 'valor'), lastV = vl[vl.length - 1];
  const age = d => d ? Math.max(0, diffDays(d, asOf)) : null;
  const m = { kind:null, calc:false, why:'', date:null, age:null, stale:false, trm:null };
  if (h.type === 'cdt'){ m.kind = 'accrual'; m.calc = true; return m; }
  if (i.isUSD){
    const set = S.settings.trm > 0, td = set ? (S.settings.trmDate || null) : null;
    m.trm = { set, rate:set ? S.settings.trm : i.trm, date:td, age:age(td), stale:set && (!td || age(td) > STALE_DAYS) };
    m.why = set ? '' : 'Define la TRM: sin ella los dólares se valoran a tu tasa de compra y no hay ganancia calculable.';
    if (h.type === 'usd'){ // dólares: la cantidad es exacta (compras − ventas); solo la TRM es manual
      m.kind = 'fx'; m.calc = set; m.date = lastV ? lastV.date : (tx.length ? tx[tx.length - 1].date : null);
      m.stale = m.trm.stale; m.age = m.trm.age; return m;
    }
    if (lastV){ m.kind = 'manual'; m.date = lastV.date; m.age = age(lastV.date); m.calc = set; m.stale = m.age > STALE_DAYS || m.trm.stale; }
    else { m.kind = 'cost'; m.why = 'Sin valoración registrada.'; }
    return m;
  }
  if (lastV){ m.kind = 'manual'; m.date = lastV.date; m.age = age(lastV.date); m.calc = true; m.stale = m.age > STALE_DAYS; }
  else { m.kind = 'cost'; m.why = 'Sin valoración registrada.'; }
  return m;
}
/* Ganancia total = valor + retirado − aportado (los retiros solo devuelven capital, no son rendimiento por sí mismos).
   Realizada / no realizada con costo promedio: cada retiro saca del costo la fracción retirada del valor que tenía la posición. */
function invRealized(h, i, m, asOf){
  const res = { gainOk: m.calc || i.closed, rzOk:false, realized:0, unrealized:0, why:'' };
  if (!res.gainOk){ res.why = m.why || 'Sin valoración registrada.'; return res; }
  if (i.closed){ res.rzOk = true; res.realized = i.withdrawn - i.contributed; return res; }
  const tx = h.tx.map((t, ix) => ({ t, ix })).filter(x => x.t.date <= asOf).sort((a, b) => a.t.date.localeCompare(b.t.date) || a.ix - b.ix).map(x => x.t);
  let cost = 0, realized = 0, ok = true; const done = [];
  for (const t of tx){
    if (t.op === 'aporte') cost += t.amount;
    else if (t.op === 'retiro'){
      const b = invInfo({ ...h, tx:done }, t.date);
      if (!(h.type === 'cdt' || h.type === 'usd' || done.some(x => x.op === 'valor'))) ok = false;
      const f = h.currency === 'USD' ? (b.units > 0 ? (t.usd || 0) / b.units : 1) : (b.value > 0 ? t.amount / b.value : 1);
      const out = cost * Math.min(1, Math.max(0, f));
      realized += t.amount - out; cost -= out;
    }
    done.push(t);
  }
  if (!ok){ res.why = 'Hay retiros anteriores a cualquier valoración registrada: no se sabe cuánto de ellos fue ganancia.'; return res; }
  res.rzOk = true; res.realized = realized; res.unrealized = i.value - cost;
  return res;
}
function portfolioAt(asOf){
  const rows = S.invest.map(h => { const i = invInfo(h, asOf), m = invMeta(h, i, asOf); return { h, i, m, rz:invRealized(h, i, m, asOf) }; });
  const act = rows.filter(r => !r.i.closed), calc = rows.filter(r => r.rz.gainOk), rzr = rows.filter(r => r.rz.rzOk);
  const gain = sum(calc, r => r.i.gain), base = sum(calc, r => r.i.contributed);
  const byType = Object.entries(ITYPES).map(([k, x]) => ({ key:k, label:x[0], color:x[2], value:sum(act.filter(r => r.h.type === k), r => r.i.value) })).filter(x => x.value > 0);
  const usdRows = act.filter(r => r.i.isUSD && r.i.units > 0), set = S.settings.trm > 0, td = set ? (S.settings.trmDate || null) : null;
  const tAge = td ? Math.max(0, diffDays(td, asOf)) : null;
  return {
    rows, value:sum(rows, r => r.i.value), contributed:sum(rows, r => r.i.contributed), withdrawn:sum(rows, r => r.i.withdrawn), net:sum(rows, r => r.i.net),
    gain, gainBase:base, pct:base ? gain / base * 100 : 0, nCalc:calc.length,
    realized:sum(rzr, r => r.rz.realized), unrealized:sum(rzr, r => r.rz.unrealized), nRz:rzr.length,
    nActive:act.length, nNoVal:act.filter(r => r.m.kind === 'cost').length, nStale:act.filter(r => r.m.stale).length, byType,
    usdValue:sum(usdRows, r => r.i.value), usdUnits:sum(usdRows, r => r.i.units),
    trm:{ hasUSD:usdRows.length > 0, set, rate:S.settings.trm, date:td, age:tAge, stale:set && (!td || tAge > STALE_DAYS) },
  };
}
/* PF:END */
function monthHasData(k){
  const s = stats(k);
  return !!(s.ex.length || s.rd.length || s.gx.length || Object.keys(s.fp).length || s.pays.length || s.potTx.length || s.invTx.length);
}
/* Compara con el mes anterior solo si ese mes tiene movimientos registrados */
function compareWithPrev(cur, prev, prevHas, k){
  const base = { prevK: shift(k, -1), prev, inProgress: k === todayKey };
  if (!prevHas) return { ...base, state:'nodata' };
  if (prev === 0) return { ...base, state: cur === 0 ? 'same' : 'prevzero' };
  const d = cur - prev;
  return { ...base, state: d === 0 ? 'same' : 'delta', d, pct: d / prev * 100 };
}
const dueDate = (m, day) => `${m}-${pad(Math.min(day, daysIn(m)))}`;
const hasDay = f => f.day >= 1 && f.day <= 31;
/* Solo gastos fijos con día de pago registrado. Los préstamos no registran fecha de pago. */
function upcomingPayments(k){
  const mode = k === todayKey ? 'current' : k > todayKey ? 'future' : 'past';
  const paid = m => S.fixedPaid[m] || {};
  const items = [];
  const add = (f, m) => { if (!paid(m)[f.id]) items.push({ f, date: dueDate(m, f.day), amount: f.amount }); };
  S.fixed.filter(hasDay).forEach(f => {
    if (mode === 'current'){
      const limit = addDays(todayStr, UPCOMING_DAYS);
      [k, shift(k, 1)].forEach(m => { if (dueDate(m, f.day) <= limit) add(f, m); });
    } else add(f, k);
  });
  /* En un mes pasado sin movimientos no hay nada que señalar como pendiente */
  if (mode === 'past' && !monthHasData(k)) items.length = 0;
  items.forEach(p => { p.days = diffDays(todayStr, p.date); });
  items.sort((a, b) => a.date.localeCompare(b.date));
  const undated = (mode === 'past' && !monthHasData(k)) ? [] : S.fixed.filter(f => !hasDay(f) && !paid(k)[f.id]);
  return { mode, items, total: sum(items), undated, undatedTotal: sum(undated), hasFixed: S.fixed.length > 0 };
}
const relDays = d => d === 0 ? 'hoy' : d === 1 ? 'mañana' : d > 1 ? `en ${d} días` : d === -1 ? 'venció ayer' : `venció hace ${-d} días`;

function dashboard(k){
  const s = stats(k), ini = initialOf(k), asOf = asOfOf(k), nw = networth(k);
  const prevK = shift(k, -1), ps = stats(prevK), prevHas = monthHasData(prevK);
  const loans = S.loans.map(l => loanInfo(l, asOf));
  const PF = portfolioAt(asOf);
  const pay = upcomingPayments(k);
  const D = {
    k, s, ini, asOf, nw, disp: nw.disp,
    incCmp: compareWithPrev(s.income, ps.income, prevHas, k),
    expCmp: compareWithPrev(s.out, ps.out, prevHas, k),
    pendFixed: sum(S.fixed.filter(f => !s.fp[f.id])),
    pendFixedN: S.fixed.filter(f => !s.fp[f.id]).length,
    debt: { has: S.loans.length > 0, total: nw.debt, active: loans.filter(l => l.balance > 0).length,
            fees: sum(S.loans.filter((l, i) => loans[i].balance > 0), l => l.fee) },
    sav: { has: S.pots.length > 0, total: nw.pots, net: s.potIn - s.potOut,
           metas: nw.metas, bols: nw.bols },
    inv: { has: S.invest.length > 0, value: nw.inv, net: PF.net, gain: PF.gain, gainN: PF.nCalc, nNoVal: PF.nNoVal, nStale: PF.nStale,
           trmAssumed: PF.trm.hasUSD && !PF.trm.set, trmStale: PF.trm.hasUSD && PF.trm.set && PF.trm.stale },
    pay, prevHas, prevOut: ps.out,
  };
  D.alerts = buildAlerts(D);
  return D;
}
function buildAlerts(D){
  const A = [], { s, disp, pay, k, prevK, prevHas, prevOut } = D, cur = k === todayKey;
  if (disp < 0) A.push({ lvl:'bad', i:'⛔', t:`Tu saldo disponible es negativo (${money(disp)}). Revisa el saldo inicial o los egresos y asignaciones registrados.`, link:['Saldo inicial','initial'] });
  if (cur){
    const od = pay.items.filter(p => p.days < 0), soon = pay.items.filter(p => p.days >= 0 && p.days <= 3);
    if (od.length) A.push({ lvl:'bad', i:'⏰', t:`${od.length === 1 ? '1 gasto fijo con fecha vencida sin marcar como pagado' : od.length + ' gastos fijos con fecha vencida sin marcar como pagados'} (${money(sum(od))}): ${od.map(p => esc(p.f.name)).join(', ')}.`, link:['Ver gastos fijos','nav','fijos'] });
    if (soon.length) A.push({ lvl:'warn', i:'📅', t:`Vence pronto: ${soon.map(p => `${esc(p.f.name)} (${relDays(p.days)})`).join(', ')}.`, link:['Ver gastos fijos','nav','fijos'] });
    if (disp >= 0 && pay.total > disp) A.push({ lvl:'warn', i:'⚠️', t:`Saldo insuficiente para los pagos de los próximos ${UPCOMING_DAYS} días: ${money(pay.total)} por pagar frente a ${money(disp)} disponibles (faltan ${money(pay.total - disp)}).` });
  }
  if (s.income > 0 && s.out > s.income) A.push({ lvl:'warn', i:'📉', t:`Tus gastos del mes (${money(s.out)}) superan tus ingresos (${money(s.income)}).` });
  if (prevHas && prevOut > 0 && s.out >= prevOut * (1 + ALERT_EXP_GROWTH)) A.push({ lvl:'warn', i:'📈', t:`Tus gastos ${cur ? 'ya ' : ''}superan en ${Math.round((s.out / prevOut - 1) * 100)}% a los de ${monthName(prevK, true)} (${money(prevOut)}).` });
  return A;
}

/* ---------- Gráficos SVG (se miden al ancho real para que el texto no se agrande) ---------- */
const CH = [];
function drawBar({labels, series, stacked, every = 1, W = 640, H = 220}){
  const L = 46, B = 28, T = 12, R = 8, w = W-L-R, h = H-T-B, n = labels.length;
  let max = 0;
  for (let i = 0; i < n; i++){ const v = series.map(s => s.values[i]); max = Math.max(max, stacked ? v.reduce((a,b)=>a+b,0) : Math.max(...v)); }
  const noData = max <= 0;
  if (noData) max = 4;
  const mag = Math.pow(10, Math.floor(Math.log10(max))) / 2; max = Math.ceil(max / mag) * mag;
  const y = v => T + h - (v / max) * h, gw = w / n;
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max/4*i; g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${noData ? '' : abbr(v)}</text>`; }
  if (noData) g += `<text x="${L + w/2}" y="${T + h/2 - 8}" text-anchor="middle">Sin datos</text>`;
  let bars = '';
  for (let i = 0; i < n; i++){
    const cx = L + gw*i + gw/2;
    if (stacked){
      const bw = Math.min(40, gw*.55); let acc = 0;
      series.forEach(s => { const v = s.values[i]; if (!v) return; const top = y(acc+v), hh = y(acc) - top; bars += `<rect x="${cx-bw/2}" y="${top}" width="${bw}" height="${Math.max(hh,1)}" rx="3" fill="${s.color}"><title>${esc(s.name)}: ${money(v)}</title></rect>`; acc += v; });
    } else {
      const bw = Math.min(28, gw*.7/series.length), tot = bw*series.length + 4*(series.length-1);
      series.forEach((s,j) => { const v = s.values[i]; const x = cx - tot/2 + j*(bw+4); bars += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(h-(y(v)-T),0)}" rx="4" fill="${s.color}"><title>${esc(s.name)}: ${money(v)}</title></rect>`; });
    }
    if (i % every === 0) bars += `<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(labels[i])}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}${bars}</svg>`;
}
function barChart(o){ const i = CH.push(o) - 1; return `<div class="chartbox" data-ci="${i}" style="height:${o.h || 220}px"></div>`; }
function fitCharts(){
  document.querySelectorAll('.chartbox').forEach(b => {
    const o = CH[+b.dataset.ci]; if (!o) return;
    b.innerHTML = drawBar({...o, W: Math.max(280, b.clientWidth || 600), H: o.h || 220});
  });
}
function donut(items, centerTop, centerSub){
  const total = sum(items, i => i.value), R = 70, C = 2*Math.PI*R; let off = 0, segs = '';
  if (total > 0) items.filter(i => i.value > 0).forEach(i => { const len = i.value/total*C; segs += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${i.color}" stroke-width="26" stroke-dasharray="${Math.max(len-2,0.1)} ${C-Math.max(len-2,0.1)}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`; off += len; });
  else segs = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--fill)" stroke-width="26"/>`;
  const svg = `<svg viewBox="0 0 200 200"><g>${segs}</g><text x="100" y="100" text-anchor="middle" font-size="19" font-weight="700" fill="var(--text)" style="fill:var(--text);font-size:19px">${esc(centerTop)}</text><text x="100" y="120" text-anchor="middle" font-size="11" fill="var(--muted)" style="fill:var(--muted);font-size:11px">${esc(centerSub)}</text></svg>`;
  const legend = `<div class="legend">${items.map(i => `<div><i style="background:${i.color}"></i>${esc(i.label)}<b>${money(i.value)}</b><em>${total ? Math.round(i.value/total*100) : 0}%</em></div>`).join('')}</div>`;
  return `<div class="donutwrap">${svg}${legend}</div>`;
}
function hbars(items){
  const max = Math.max(...items.map(i => i.value), 1);
  if (!items.length || items.every(i => !i.value)) return '<div class="empty">Sin datos este mes</div>';
  return items.filter(i => i.value > 0).map(i => `<div class="hb"><div class="top"><span>${esc(i.label)}</span><b>${money(i.value)}</b></div><div class="track"><div class="fill" style="width:${i.value/max*100}%;background:${i.color}"></div></div></div>`).join('');
}

let formCtx = null;
const parseMoney = s => { const neg = /^\s*-/.test(s); const d = String(s).replace(/\D/g,''); return d ? (neg ? -1 : 1) * parseInt(d, 10) : 0; };
const T = x => typeof x === 'function' ? x(formCtx) : x;

function fieldHTML(f, val){
  const c = formCtx;
  if (f.t === 'seg'){
    if (c.edit){ const o = f.opts.find(o => o[0] === val); return `<div class="segc"><button type="button" class="on" disabled>${esc(o ? o[1] : '')}</button></div>`; }
    return `<div class="segc">${f.opts.map(o => `<button type="button" class="${o[0] === val ? 'on' : ''}" data-a="seg" data-n="${f.n}" data-v="${o[0]}">${esc(o[1])}</button>`).join('')}</div>`;
  }
  if (f.t === 'select') return `<label>${esc(f.l)}<select name="${f.n}" ${f.rerender ? 'data-rerender' : ''} ${f.locked && c.edit ? 'disabled' : ''}>${f.opts.map(o => `<option value="${esc(o[0])}" ${o[0] === val ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  if (f.t === 'money') return `<label>${esc(f.l)}<input name="${f.n}" data-money inputmode="numeric" autocomplete="off" placeholder="$ 0" value="${val ? fmt(val) : ''}"></label>`;
  if (f.t === 'num') return `<label>${esc(f.l)}<input name="${f.n}" type="number" min="0" step="${f.step || 1}" inputmode="decimal" placeholder="${esc(f.ph || '')}" value="${val ? esc(val) : ''}"></label>`;
  if (f.t === 'date') return `<label>${esc(f.l)}<input name="${f.n}" type="date" value="${esc(val)}"></label>`;
  return `<label>${esc(f.l)}<input name="${f.n}" type="text" autocomplete="off" ${f.list ? `list="${f.list}"` : ''} placeholder="${esc(f.ph || '')}" value="${esc(val)}"></label>`;
}
function collect(){
  const def = FORMS[formCtx.kind], f = $('form'), out = {...formCtx.vals};
  def.fields(formCtx.vals).forEach(fl => {
    if (fl.t === 'seg') return;
    const el = f.elements[fl.n]; if (!el) return;
    out[fl.n] = fl.t === 'money' ? parseMoney(el.value) : fl.t === 'num' ? (el.value === '' ? 0 : Number(el.value)) : el.value;
  });
  return out;
}
function paint(first){
  const c = formCtx, def = FORMS[c.kind], fields = def.fields(c.vals);
  const chips = def.chips && !c.edit ? def.chips(c) : null;
  $('modal').innerHTML = `<h2>${esc(T(def.title))}</h2><p class="desc">${esc(T(def.desc))}</p>` +
    (chips ? `<div class="tchips">${chips.map((x, i) => `<button type="button" class="tchip" data-a="chip" data-i="${i}">${x[0]} ${esc(x[1])}</button>`).join('')}</div>` : '') +
    `<form id="form" novalidate>${fields.map(f => fieldHTML(f, c.vals[f.n])).join('')}<div class="hint" id="hint"></div><p class="err" id="err"></p>${def.extraHTML ? def.extraHTML(c) : ''}
    <div class="actions"><button type="button" class="btn btn-soft" data-a="close">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div></form>` +
    (fields.some(f => f.list) ? `<datalist id="platforms">${PLATFORMS.map(p => `<option value="${esc(p)}"></option>`).join('')}</datalist>` : '');
  const form = $('form');
  const upd = () => { if (!def.hint) return; const h = def.hint(collect()); $('hint').textContent = h; $('hint').classList.toggle('show', !!h); };
  form.addEventListener('input', e => {
    if (e.target.dataset.money !== undefined){ const v = parseMoney(e.target.value); e.target.value = e.target.value.trim() === '' ? '' : (v < 0 ? '-' : '') + fmt(Math.abs(v)); }
    upd();
  });
  form.addEventListener('change', e => { if (e.target.dataset.rerender !== undefined){ c.vals = collect(); paint(); } });
  form.addEventListener('submit', e => { e.preventDefault(); submitForm(); });
  upd();
  if (first){ const el = form.querySelector('input:not([type=date]),select:not(:disabled)'); setTimeout(() => el && el.focus(), 60); }
}
function openForm(kind, id, extra){
  const def = FORMS[kind]; extra = extra || {};
  let item = null, vals, ctx = {};
  if (kind === 'income' && id){
    item = COLL[extra.coll]().find(x => x.id === id); ctx.coll = extra.coll;
    vals = extra.coll === 'rides'
      ? {src:'repartidor', date:item.date, gross:item.gross, fuel:item.fuel, note:item.note || ''}
      : {src:item.type, date:item.date, amount:item.amount, note:item.desc || ''};
  } else {
    if (id && def.coll) item = COLL[def.coll]().find(x => x.id === id) || null;
    vals = item ? {...item} : def.defaults(extra);
    if (kind === 'inv' && item) vals.date = item.start || '';
  }
  if (kind === 'pot') ctx.pk = item ? item.kind : extra.kind;
  formCtx = {kind, item, edit:!!item, extra, vals, ...ctx};
  $('overlay').classList.add('open');
  paint(true);
}
function closeForm(){ $('overlay').classList.remove('open'); formCtx = null; }
function submitForm(){
  const def = FORMS[formCtx.kind], v = collect();
  const ok = def.valid ? def.valid(v) : true;
  if (ok !== true){ const e = $('err'); e.textContent = ok; e.style.display = 'block'; return; }
  const c = formCtx;
  if (def.save) def.save(v, c);
  else if (c.item) Object.assign(c.item, v);
  else COLL[def.coll]().push({id:uid(), ...v, ...(def.init ? def.init() : {})});
  save(); closeForm(); render(); toast('Guardado');
}

    ['repartidor','Repartidor','<path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>'],

  ['Gastos', [
    ['gastos','Gastos','<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12l4 4 4-4"/>'],
    ['fijos','Gastos fijos','<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'],
    ['prestamos','Préstamos','<rect x="1" y="4" width="22" height="16" rx="3"/><path d="M1 10h22"/>']]],
  ['Ahorro e inversión', [
    ['metas','Metas','<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'],
    ['bolsillos','Bolsillos','<path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>'],

const TITLES = {resumen:'Resumen', patrimonio:'Patrimonio', repartidor:'Repartidor', extras:'Dinero extra', gastos:'Gastos', fijos:'Gastos fijos', prestamos:'Préstamos', metas:'Metas', bolsillos:'Bolsillos', inversiones:'Inversiones'};

const kpi = (l, v, s, cls) => `<div class="card kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
const emptyBox = (t, s) => `<div class="empty"><b>${t}</b>${s}</div>`;
const delBtn = (k, id) => `<button class="ico-btn" data-a="edit" data-k="${k}" data-id="${id}" title="Editar">✎</button><button class="ico-btn" data-a="del" data-k="${k}" data-id="${id}" title="Eliminar">✕</button>`;

const sgn = n => n > 0 ? '+ ' : n < 0 ? '− ' : '';
function cmpHTML(c, goodUp){
  const lab = monthName(c.prevK, true), cur = c.inProgress ? ' · mes en curso' : '';
  if (c.state === 'nodata') return `<div class="cmp muted">Sin datos de ${lab} para comparar</div>`;
  if (c.state === 'prevzero') return `<div class="cmp muted">${lab}: $ 0 · sin base para comparar</div>`;
  if (c.state === 'same') return `<div class="cmp muted">Igual que ${lab}${cur}</div>`;
  const up = c.d > 0, p = Math.abs(c.pct);
  return `<div class="cmp ${up === goodUp ? 'pos' : 'neg'}">${up ? '▲' : '▼'} ${p < 1 ? '<1' : Math.round(p)}% vs ${lab} (${money(c.prev)})${cur}</div>`;
}
const miniRows = rows => `<div class="mini">${rows.map(r => `<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;
const dueRow = (p, mode) => {
  const [y, m, d] = p.date.split('-').map(Number);
  const when = mode === 'past' ? 'sin marcar como pagado' : relDays(p.days);
  const cls = p.days < 0 && mode === 'current' ? 'neg' : (p.days <= 3 && mode === 'current' ? 'warnc' : '');
  return `<div class="due"><div class="dd"><b>${d}</b><span>${esc(monthName(`${y}-${pad(m)}`, true))}</span></div><div class="dn"><b>${esc(p.f.name)}</b><small class="${cls}">${when}</small></div><div class="da">${money(p.amount)}</div></div>`;
};

function vResumen(){
  const k = ui.month, D = dashboard(k), s = D.s, nw = D.nw, ini = D.ini, fin = D.disp;

  const egress = [
    {label:'Gastos', value:s.expT, color:'#ff5a52'},
    {label:'Gastos fijos', value:s.fixedT, color:'#ff9f0a'},

  const incomeBars = [{label:'Repartidor (neto)', value:s.net, color:'#30b455'}, ...SOURCES.map(x => ({label:x[1], value:sum(s.ex.filter(e => e.type === x[0])), color:x[3]}))];
  const mov = [
    ...s.ex.map(x => ({d:x.date, t:srcOf(x.type)[1] + (x.desc ? ' · ' + x.desc : ''), v:x.amount, i:srcOf(x.type)[2]})),
    ...s.rd.map(x => ({d:x.date, t:'Repartidor' + (x.note ? ' · ' + x.note : ''), v:rideNet(x), i:'🛵'})),
    ...s.gx.map(x => ({d:x.date, t:x.desc, v:-x.amount, i:'🧾'})),
    ...S.fixed.filter(f => s.fp[f.id]).map(f => ({d:s.fp[f.id].date, t:'Fijo · ' + f.name, v:-s.fp[f.id].amount, i:'📌'})),
    ...s.pays.map(p => ({d:p.date, t:'Préstamo · ' + p.loan, v:-payTotal(p), i:'🏦'})),
    ...s.potTx.map(t => ({d:t.date, t:(t.amount > 0 ? 'Ahorro · ' : 'Retiro · ') + t.pot.name, v:-t.amount, i:t.pot.icon, n:true})),
    ...s.invTx.map(t => ({d:t.date, t:(t.op === 'aporte' ? 'Inversión · ' : 'Retiro · ') + t.h.name, v:t.op === 'aporte' ? -t.amount : t.amount, i:ITYPES[t.h.type][1], n:true})),
  ].sort((a,b) => b.d.localeCompare(a.d));
  const srcLabel = ini.src === 'manual' ? 'Definido por ti' : ini.src === 'carry' ? 'Viene del mes anterior' : 'Empiezas en $ 0';

  const showProj = D.pendFixedN > 0 && k >= todayKey;

  const alerts = D.alerts.length ? `<div class="alerts">${D.alerts.map(a => `<div class="alert ${a.lvl}"><span class="ai">${a.i}</span><span class="at">${a.t}</span>${a.link ? `<a href="#" data-a="${a.link[1]}"${a.link[2] ? ` data-v="${a.link[2]}"` : ''}>${a.link[0]}</a>` : ''}</div>`).join('')}</div>` : '';

  const flowCls = s.flow > 0 ? 'pos' : s.flow < 0 ? 'neg' : '';
  const emptyCard = (label, txt, def, link) => `<div class="card kpi"><div class="l" title="${esc(def)}">${label}</div><div class="v dim">—</div><div class="nodata">${txt}${link ? ` <a href="#" data-a="nav" data-v="${link[1]}">${link[0]}</a>` : ''}</div></div>`;

  const debtCard = !D.debt.has ? emptyCard('Deudas pendientes', 'Sin datos suficientes: no hay préstamos registrados.', 'Capital pendiente de todos los préstamos registrados, sin intereses futuros.', ['Agregar préstamo','prestamos'])
    : `<div class="card kpi"><div class="l" title="Capital pendiente de todos los préstamos registrados, sin intereses futuros.">Deudas pendientes</div><div class="v ${D.debt.total > 0 ? 'neg' : ''}">${money(D.debt.total)}</div>
       <div class="s">${D.debt.total > 0 ? 'Capital pendiente, sin intereses futuros' : 'Sin capital pendiente'}</div>
       ${miniRows([['Préstamos con saldo', D.debt.active], ['Cuotas mensuales', money(D.debt.fees)]])}</div>`;
  const savCard = !D.sav.has ? emptyCard('Ahorros', 'Sin datos suficientes: no hay metas ni bolsillos registrados.', 'Saldo acumulado en metas y bolsillos al cierre del mes. No forma parte del saldo disponible.', ['Crear una meta','metas'])
    : `<div class="card kpi"><div class="l" title="Saldo acumulado en metas y bolsillos al cierre del mes. No forma parte del saldo disponible.">Ahorros</div><div class="v neu">${money(D.sav.total)}</div>
       <div class="s">Metas y bolsillos</div>
       ${miniRows([['En metas', money(D.sav.metas)], ['En bolsillos', money(D.sav.bols)], ['Neto apartado este mes', sgn(D.sav.net) + money(Math.abs(D.sav.net))]])}</div>`;
  const invCard2 = !D.inv.has ? emptyCard('Inversiones', 'Sin datos suficientes: no hay inversiones registradas.', 'Valor registrado de tus inversiones al cierre del mes. No forma parte del saldo disponible.', ['Agregar inversión','inversiones'])
    : `<div class="card kpi"><div class="l" title="Valor registrado de tus inversiones al cierre del mes. No forma parte del saldo disponible.">Inversiones</div><div class="v neu">${money(D.inv.value)}</div>
       <div class="s">Valor registrado, separado del efectivo</div>
       ${miniRows([['Aportado (neto)', money(D.inv.net)], ['Ganancia / pérdida', D.inv.gainN ? sgn(D.inv.gain) + money(Math.abs(D.inv.gain)) : 'No calculable']])}
       ${D.inv.nNoVal ? `<div class="nodata">${D.inv.nNoVal} sin valoración registrada: se cuentan al capital aportado.</div>` : ''}
       ${D.inv.nStale ? `<div class="nodata">${D.inv.nStale} con valor de hace más de ${STALE_DAYS} días o con TRM desactualizada.</div>` : ''}
       ${D.inv.trmAssumed ? '<div class="nodata">Dólares sin TRM definida: se valoran a tu tasa de compra.</div>' : ''}</div>`;

  const P = D.pay, payTitle = P.mode === 'current' ? `Próximos ${UPCOMING_DAYS} días` : P.mode === 'future' ? 'Programados del mes' : 'Sin marcar como pagados';
  const payBody = P.items.length
    ? `${P.items.map(p => dueRow(p, P.mode)).join('')}<div class="kv"><span>Total</span><b>${money(P.total)}</b></div>`
    : `<div class="empty"><b>${P.hasFixed ? 'Sin pagos próximos con fecha registrada' : 'Aún no tienes gastos fijos'}</b>${P.hasFixed ? (P.undated.length ? '' : (P.mode === 'current' ? 'Nada vence en los próximos ' + UPCOMING_DAYS + ' días.' : 'No hay pagos con fecha pendientes en este mes.')) : 'Agrega tus gastos fijos con su día de pago para verlos aquí.'}</div>`;
  const undatedNote = P.undated.length ? `<p class="note" style="margin:10px 0 0">${P.undated.length} gasto${P.undated.length > 1 ? 's' : ''} fijo${P.undated.length > 1 ? 's' : ''} sin día de pago registrado (${money(P.undatedTotal)}): agrégalo en Gastos fijos para verlo aquí.</p>` : '';

  return `
  <div class="hero">
    <div><div class="l" title="Saldo inicial + ingresos − gastos − ahorro e inversión neto">Saldo disponible · ${esc(monthName(k))}${k > todayKey ? ' · proyección con lo registrado' : ''}</div>
      <div class="big"><small>${fin < 0 ? '− $' : '$'}</small>${fmt(Math.abs(fin))}</div></div>
    <div class="side hbox">${hr('Saldo inicial', money(ini.v))}${hr('+ Ingresos', money(s.income))}${hr('− Gastos', money(s.out))}${hr(s.alloc < 0 ? '+ Retiros netos de ahorro e inversión' : '− Ahorro e inversión (neto)', money(Math.abs(s.alloc)))}
      ${showProj ? `<div class="hrow tot"><span>Tras ${D.pendFixedN} fijo${D.pendFixedN > 1 ? 's' : ''} pendiente${D.pendFixedN > 1 ? 's' : ''} (${money(D.pendFixed)})</span><b>${money(fin - D.pendFixed)}</b></div>` : ''}
      <button class="btn btn-sm" data-a="initial">Saldo inicial · ${srcLabel}</button></div>
  </div>
  ${alerts}
  <div class="grid g3">
    <div class="card kpi big"><div class="l" title="Repartidor (ganancias − gasolina) + trabajo independiente + otros ingresos. No incluye retiros de ahorro ni de inversión.">Ingresos del mes</div><div class="v ${s.income > 0 ? 'pos' : ''}">${money(s.income)}</div>${cmpHTML(D.incCmp, true)}
      ${miniRows([['Repartidor (neto)', money(s.net)], ['Independiente y otros', money(s.extrasT)]])}</div>
    <div class="card kpi big"><div class="l" title="Gastos + gastos fijos marcados como pagados + pagos de préstamos. No incluye aportes a ahorro ni a inversión.">Gastos del mes</div><div class="v ${s.out > 0 ? 'neg' : ''}">${money(s.out)}</div>${cmpHTML(D.expCmp, false)}
      ${miniRows([['Gastos', money(s.expT)], ['Fijos pagados', money(s.fixedT)], ['Pagos de préstamos', money(s.loanT)]])}</div>
    <div class="card kpi big"><div class="l" title="Ingresos − gastos − ahorro e inversión neto. Es la variación del saldo disponible en el mes.">Flujo neto mensual</div><div class="v ${flowCls}">${sgn(s.flow)}${money(Math.abs(s.flow))}</div><div class="cmp muted">Variación del saldo disponible</div>
      ${miniRows([['Ingresos', money(s.income)], ['Gastos', '− ' + money(s.out).replace('− ', '')], [s.alloc < 0 ? 'Retiros netos de ahorro e inversión' : 'Ahorro e inversión (neto)', (s.alloc < 0 ? '+ ' : '− ') + money(Math.abs(s.alloc))]])}</div>
  </div>
  <div class="sec-head"><h3>Fuera del efectivo</h3><span class="note">No forman parte del saldo disponible</span></div>
  <div class="grid g3">${debtCard}${savCard}${invCard2}</div>
  <div class="grid g2">
    <div class="card"><h3>Próximos pagos <span>${payTitle}</span></h3>${payBody}${undatedNote}</div>
    <div class="card"><h3>Movimientos del mes <span>${mov.length} en total</span></h3>${mov.length ? `<div class="scroll"><table><tbody>${mov.map(m => `<tr><td style="width:34px;font-size:18px;padding-left:0">${m.i}</td><td>${esc(m.t)}<div style="color:var(--muted);font-size:12px">${dShort(m.d)}</div></td><td class="r ${m.n ? 'neu' : m.v < 0 ? 'neg' : 'pos'}"><b>${m.v < 0 ? '−' : '+'} ${money(Math.abs(m.v))}</b></td></tr>`).join('')}</tbody></table></div>` : emptyBox('Aún no hay movimientos', 'Agrega dinero o registra un gasto para empezar.')}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Ingresos vs egresos <span>Últimos 6 meses</span></h3>
      ${barChart({labels:hist.map(m => monthName(m,true)), series:[{name:'Ingresos', color:'#30b455', values:hs.map(x => x.income)},{name:'Egresos', color:'#ff5a52', values:hs.map(x => x.out)}], h:230})}
      <div class="key"><span><i style="background:#30b455"></i>Ingresos</span><span><i style="background:#ff5a52"></i>Egresos</span></div></div>
    <div class="card"><h3>Distribución de egresos <span>${esc(monthName(k))}</span></h3>${donut(egress, money(s.out).replace('$ ','$'), 'egresos')}</div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>¿De dónde viene el dinero?</h3>${hbars(incomeBars)}</div>
    <div class="card"><h3>Patrimonio neto <span>referencia · al cierre de ${esc(monthName(k, true))}</span></h3>
      <div class="nwbig ${nw.total < 0 ? 'neg' : ''}">${money(nw.total)}</div>
      <div class="kv"><span>Saldo disponible</span><b>${money(nw.disp)}</b></div>
      <div class="kv"><span>En metas y bolsillos</span><b>${money(nw.pots)}</b></div>
      <div class="kv"><span>En inversiones</span><b>${money(nw.inv)}</b></div>
      <div class="kv"><span>Deuda (capital pendiente)</span><b class="neg">${nw.debt ? '− ' + money(nw.debt).replace('− ','') : money(0)}</b></div>
      <p class="note" style="margin:10px 0 0">Suma ahorros e inversiones al efectivo solo para medir tu patrimonio; no es dinero disponible.${D.inv.nNoVal || D.inv.nStale || D.inv.trmAssumed ? ' Algunas valoraciones están sin registrar o desactualizadas.' : ''} <a href="#" data-a="nav" data-v="patrimonio" style="color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap">Ver detalle</a></p></div>
  </div>
  <details class="card"><summary>Cómo se calcula cada indicador</summary><div class="body"><ul>
    <li><b>Saldo disponible:</b> saldo inicial + ingresos − gastos − ahorro e inversión neto. Es el efectivo registrado al cierre del mes (o hasta hoy, si es el mes en curso).</li>
    <li><b>Ingresos:</b> repartidor (ganancias − gasolina) + trabajo independiente + otros ingresos. Retirar de un ahorro o inversión no cuenta como ingreso.</li>
    <li><b>Gastos:</b> gastos + gastos fijos marcados como pagados + pagos de préstamos (capital, intereses y seguro). Aportar a ahorro o inversión no es un gasto.</li>
    <li><b>Flujo neto mensual:</b> ingresos − gastos − ahorro e inversión neto (aportes − retiros). Es lo que cambió tu saldo disponible en el mes.</li>
    <li><b>Comparación:</b> contra el mes anterior, solo si ese mes tiene movimientos registrados. En el mes en curso se compara con el mes anterior completo.</li>
    <li><b>Deudas pendientes:</b> capital pendiente de todos los préstamos registrados, sin intereses futuros.</li>
    <li><b>Ahorros:</b> saldo de metas y bolsillos al cierre del mes. <b>Inversiones:</b> valor registrado al cierre del mes (CDT según su tasa y plazo; el resto según el último valor que actualizaste o lo aportado).</li>
    <li><b>Próximos pagos:</b> gastos fijos con día de pago registrado y sin marcar como pagados. Los préstamos no registran fecha de pago, por eso no aparecen.</li>
    <li><b>Alertas:</b> saldo negativo; pagos fijos vencidos o que vencen en 3 días; pagos de los próximos ${UPCOMING_DAYS} días mayores al saldo; gastos mayores que los ingresos; gastos ${Math.round(ALERT_EXP_GROWTH * 100)}% o más sobre el mes anterior.</li>
  </ul></div></details>`;
}

function vRepartidor(){
  const k = ui.month, s = stats(k), n = daysIn(k);
  const days = Array.from({length:n}, (_, i) => sum(s.rd.filter(r => +r.date.slice(8) === i+1), rideNet));
  const worked = new Set(s.rd.map(r => r.date)).size;
  const rows = [...s.rd].sort((a,b) => b.date.localeCompare(a.date));
  const best = s.rd.reduce((a, r) => !a || rideNet(r) > rideNet(a) ? r : a, null);
  const fuelPct = s.gross ? s.fuel / s.gross * 100 : 0;
  return `
  <div class="grid g5">
    ${kpi('Ganancias brutas', money(s.gross), '', '')}
    ${kpi('Gasolina', money(s.fuel), '', 'neg')}
    ${kpi('Neto', money(s.net), 'Se suma a tus ingresos', 'pos')}
    ${kpi('Días trabajados', worked, '')}
    ${kpi('Promedio neto / día', money(worked ? s.net / worked : 0), '')}
  </div>
  <div class="split32">
    <div class="card"><h3>Neto por día <span>${esc(monthName(k))}</span></h3>${barChart({labels:days.map((_, i) => String(i+1)), series:[{name:'Neto', color:'#30b455', values:days}], every:n > 16 ? 3 : 1, h:190})}</div>
    <div class="card"><h3>Rendimiento</h3>
      <div class="kv"><span>Mejor jornada</span><b>${best ? money(rideNet(best)) + ' · ' + dShort(best.date) : '—'}</b></div>
      <div class="kv"><span>Gasolina sobre ganancias</span><b>${fuelPct.toFixed(1).replace('.',',')}%</b></div>
      <div class="kv"><span>Ganancia bruta / jornada</span><b>${money(s.rd.length ? s.gross / s.rd.length : 0)}</b></div>
      <div class="kv"><span>Jornadas registradas</span><b>${s.rd.length}</b></div></div>
  </div>
  <div class="card"><h3>Jornadas <button class="btn btn-primary btn-sm" data-a="addmoney" data-src="repartidor">+ Registrar jornada</button></h3>
  ${rows.length ? `<table><thead><tr><th>Fecha</th><th>Nota</th><th class="r">Ganancias</th><th class="r">Gasolina</th><th class="r">Neto</th><th></th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${dShort(r.date)}</td><td style="color:var(--muted)">${esc(r.note)}</td><td class="r">${money(r.gross)}</td><td class="r neg">${r.fuel ? '− ' + money(r.fuel).replace('− ','') : '—'}</td><td class="r pos"><b>${money(rideNet(r))}</b></td><td class="act">${delBtn('rides', r.id)}</td></tr>`).join('')}</tbody></table>` : emptyBox('Sin jornadas este mes', 'Registra lo que ganaste hoy y lo que gastaste en gasolina.')}</div>`;
}

function vGastos(){
