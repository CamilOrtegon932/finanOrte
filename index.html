/* ----- Simulador de abonos: vista ----- */
const ADM = { '?':'No confirmado', plazo:'Solo reducir plazo', cuota:'Solo reducir cuota', ambas:'Reducir plazo o cuota' };
const simSt = id => ui.sim[id] || (ui.sim[id] = { open:false, amts:['', '', ''], sel:0 });
function rateText(l){
  const r = loanRate(l);
  if (!r) return 'No registrada';
  return r.kind === 'ea' ? `${dec2(r.input)}% E.A. ≈ ${pc(r.m)} mensual` : r.kind === 'mv' ? `${dec2(r.input)}% mensual ≈ ${dec2(eaOf(r.m))}% E.A.` : 'Sin intereses (0%)';
}
function simDataHTML(l, P){
  const ob = observedRate(l);
  const it = [
    ['Saldo pendiente (capital)', money(P.B)],
    ['Cuota registrada', P.fee ? money(P.fee) : 'No registrada'],
    ['Cuotas restantes', P.left + (l.term ? ` de ${l.term}` : '')],
    ['Tasa registrada', rateText(l)],
    ...(P.rate && P.rate.kind === 'implicita' ? [['Tasa implícita (estimada)', `≈ ${pc(P.rate.m)} mensual, incluye seguros y otros cargos`]] : []),
    ...(ob ? [['Tasa observada en tu último pago', `${pc(ob.m)} mensual (${dShort(ob.date)})`]] : []),
    ['Seguro y otros cargos por cuota', P.ins ? money(P.ins) : 'No registrado'],
    ['Sistema de cuota', l.system === 'otro' ? 'Decreciente u otro (no soportado)' : l.system === 'fija' ? 'Cuota fija' : 'Cuota fija (supuesto)'],
    ['Abono extra permite', ADM[P.adm]]];
  return `<div class="simdata">${it.map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join('')}</div>`;
}
function simBanner(P){
  if (P.mode === 'full') return '<div class="simb">Estimación con la tasa que registraste. No es un valor oficial de tu entidad.</div>';
  if (P.mode === 'limited') return `<div class="simb warn"><b>Estimación limitada.</b> No registraste la tasa, así que se usa la tasa implícita que resulta de tu saldo, tu cuota y tus cuotas restantes (≈ ${pc(P.rate.m)} mensual). Esa tasa mezcla intereses, seguros y otros cargos: úsala solo como orientación.</div>`;
  return `<div class="simb warn"><b>Datos insuficientes para estimar plazo e intereses.</b> ${P.missing.length ? 'Falta: ' + P.missing.join(', ') + '. ' : ''}${P.notes.join(' ')} Por ahora solo se calcula el saldo después del abono.</div>`;
}
const nq = n => n + (n === 1 ? ' cuota' : ' cuotas');
function simDetail(l, P, sel){
  const sc = sel.sc, b = P.base;
  const regBtn = `<div class="btns" style="margin-top:12px"><button class="btn btn-primary btn-sm" data-a="simreg" data-id="${l.id}" data-i="${sel.i}">Registrar ${money(sel.A)} como abono real…</button><button class="btn btn-soft btn-sm" data-a="simclear" data-id="${l.id}">Limpiar simulación</button></div>`;
  if (P.mode !== 'full' && P.mode !== 'limited'){
    return `<table class="simtbl"><thead><tr><th></th><th>Hoy</th><th>Después del abono</th></tr></thead><tbody><tr><td>Saldo de capital</td><td>${money(P.B)}</td><td>${money(sc.B2)}</td></tr></tbody></table>${regBtn}`;
  }
  const showP = P.adm !== 'cuota', showC = P.adm !== 'plazo', unc = P.adm === '?' ? '<em class="unc">sin confirmar con tu entidad</em>' : '';
  const dn = x => x && x.dN > 0 ? `<span class="d">−${nq(x.dN)}</span>` : '';
  const cell = (x, f) => x ? f(x) : 'n/d';
  const head = ['Plan actual', showP && 'Abono y mantener la cuota' + unc, showC && 'Abono y reducir la cuota' + unc].filter(Boolean);
  const row = (lab, base, fp, fc, cls) => `<tr class="${cls || ''}"><td>${lab}</td><td>${base}</td>${showP ? `<td>${cell(sc.plazo, fp)}</td>` : ''}${showC ? `<td>${cell(sc.cuota, fc)}</td>` : ''}</tr>`;
  const liq = sc.liquid;
  const rows = [
    row('Saldo de capital', money(P.B), () => money(sc.B2), () => money(sc.B2)),
    row('Cuotas restantes', nq(b.n), x => liq ? 'Deuda liquidada' : nq(x.n) + dn(x), x => liq ? 'Deuda liquidada' : nq(x.n)),
    row('Cuota (capital + intereses)', money(P.c), x => liq ? '—' : money(x.c), x => liq ? '—' : money(x.c) + (x.c < P.c ? `<span class="d">−${money(P.c - x.c)}</span>` : '')),
    row('Intereses restantes', money(b.int), x => money(x.int), x => money(x.int)),
    ...(P.ins ? [row('Seguro y otros cargos restantes', money(b.ins), x => money(x.ins), x => money(x.ins))] : []),
    row('Total desde hoy (incluye el abono)', money(b.total), x => money(x.total), x => money(x.total)),
    row('Ahorro estimado vs. plan actual', '—', x => money(x.dInt + x.dIns), x => money(x.dInt + x.dIns), 'sv')].join('');
  return `<table class="simtbl"><thead><tr><th>Abono de ${money(sel.A)}</th>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
    ${liq ? '<div class="simfoot">Para liquidar, tu entidad normalmente cobra además los intereses causados desde la última cuota: pide el valor de «pago total».</div>' : ''}${regBtn}`;
}
function simMulti(l, P, oks, sel){
  if (P.mode !== 'full' && P.mode !== 'limited') return '';
  const showP = P.adm !== 'cuota', showC = P.adm !== 'plazo';
  const body = oks.map(r => { const sc = r.sc; const pz = sc.plazo, cu = sc.cuota;
    return `<tr class="pick ${r.i === sel.i ? 'on' : ''}" data-a="simsel" data-id="${l.id}" data-i="${r.i}"><td>${money(r.A)}</td><td>${money(sc.B2)}</td>${showP ? `<td>${pz ? (sc.liquid ? 'Liquida' : nq(pz.n) + (pz.dN ? ` (−${pz.dN})` : '')) : 'n/d'}</td><td>${pz ? money(pz.dInt) : 'n/d'}</td>` : ''}${showC ? `<td>${cu ? (sc.liquid ? 'Liquida' : money(cu.c)) : 'n/d'}</td><td>${cu ? money(cu.dInt) : 'n/d'}</td>` : ''}</tr>`; }).join('');
  return `<table class="simtbl"><thead><tr><th>Comparar importes</th><th>Saldo después</th>${showP ? '<th>Mantener cuota:<br>cuotas</th><th>Intereses ahorrados</th>' : ''}${showC ? '<th>Reducir cuota:<br>nueva cuota</th><th>Intereses ahorrados</th>' : ''}</tr></thead><tbody>
    <tr><td>Plan actual</td><td>${money(P.B)}</td>${showP ? `<td>${nq(P.base.n)}</td><td>—</td>` : ''}${showC ? `<td>${money(P.c)}</td><td>—</td>` : ''}</tr>${body}</tbody></table><div class="simfoot">Toca una fila para ver su detalle completo.</div>`;
}
function simResHTML(l){
  const st = simSt(l.id), P = simPlan(l);
  if (P.mode === 'paid') return '';
  const rows = st.amts.map((x, i) => ({ i, ...simCheck(x, P.B) }));
  let h = rows.filter(r => r.state === 'err').map(r => `<div class="simerr">Abono ${r.i + 1}: ${r.msg}</div>`).join('');
  const oks = rows.filter(r => r.state === 'ok').map(r => ({ ...r, sc:simScenario(P, r.A) }));
  if (!oks.length) return h + (h ? '' : '<div class="simfoot">Escribe un importe para ver la simulación. Nada de lo que escribas aquí se registra como pago.</div>');
  const sel = oks.find(r => r.i === st.sel) || oks[0];
  h += simDetail(l, P, sel) + (oks.length > 1 ? simMulti(l, P, oks, sel) : '');
  if (P.mode === 'full' || P.mode === 'limited') h += P.notes.map(n => `<div class="simb warn">${n}</div>`).join('');
  h += `<div class="simfoot"><b>Estimado, no oficial.</b> Tu entidad puede recalcular la cuota o el plazo de otra forma, cobrar comisiones o intereses causados, o aplicar el abono en otra fecha. El resultado real depende de sus condiciones.</div>`;
  return h;
}
function simPanelHTML(l){

  const inputs = st.amts.map((x, i) => `<label>${i === 0 ? 'Abono a simular' : 'Comparar con (opcional)'}<input data-sim="${l.id}" data-i="${i}" inputmode="numeric" autocomplete="off" placeholder="$ 0" value="${esc(x)}"></label>`).join('');
  return `<div class="sim"><h5>Simulador de abono extraordinario</h5>

    <div class="btns" style="margin:0 0 4px"><button class="btn btn-soft btn-sm" data-a="edit" data-k="loans" data-id="${l.id}">Editar datos para simular</button></div>
    <div class="simin">${inputs}</div><div class="simchips">${chips}</div>
    <div id="simres-${l.id}">${simResHTML(l)}</div>
    <details><summary>Cómo se calcula</summary>
      <p>Tasa mensual: i = (1 + E.A.)<sup>1/12</sup> − 1. Cada mes: interés = saldo × i; capital = cuota (sin seguro) − interés; saldo nuevo = saldo − capital. La última cuota es lo que falte.</p>
      <p><b>Mantener la cuota:</b> se simula mes a mes con el saldo menor hasta llegar a 0. <b>Reducir la cuota:</b> se conservan las cuotas restantes del plan y la nueva cuota es C = S·i / (1 − (1+i)<sup>−n</sup>). El seguro se suma aparte y se supone fijo por cuota.</p>
      <p>Se supone un abono hecho justo después de pagar una cuota, sin comisiones, con cuota fija y sin cobros adicionales. Con la tasa implícita, i se despeja de tu saldo, tu cuota y tus cuotas restantes.</p></details></div>`;
}

/* ----- Metas y bolsillos ----- */
function potCard({p, i}){
  const tgt = i.tgt > 0, avg = avgExpense();
  const sub = p.kind === 'meta'
    ? 'Meta' + (p.deadline ? ' · para el ' + dFull(p.deadline) : ' · sin fecha límite')
    : 'Bolsillo' + (tgt ? '' : ' · sin tope');
  const lines = [];
  if (i.done) lines.push(`<span class="pill ok">✓ Completada${i.doneOn ? ' el ' + dFull(i.doneOn) : ''}</span>`);
  else if (tgt){
    lines.push(`<div>Faltan <b>${money(i.rem)}</b></div>`);
    if (p.deadline){
      lines.push(`<div>${i.overdue ? '<span class="pill bad">Fecha límite vencida</span>' : `Necesitas <b>≈ ${money(i.need)}</b> al mes (${i.mleft} mes${i.mleft === 1 ? '' : 'es'})`}</div>`);
    }
    if (i.eta) lines.push(`<div>Con tu ritmo actual (<b>${money(i.pace)}</b>/mes) la completas hacia <b>${esc(monthName(i.eta))}</b> ${p.deadline ? (i.late ? '<span class="pill warn">llegarías tarde</span>' : '<span class="pill ok">vas a tiempo</span>') : ''}</div>`);
    else if (!i.pace) lines.push('<div>Aún no hay aportes recientes para estimar cuándo la completas.</div>');
  } else if (p.kind === 'bolsillo' && tgt && i.bal >= i.tgt) lines.push('<span class="pill ok">Tope alcanzado</span>');
  if (isEmergency(p)) lines.push(avg > 0 ? `<div>Cubre <b>${dec1(i.bal / avg)} meses</b> de tus gastos (promedio ${money(avg)}/mes)</div>` : '<div>Registra tus gastos para saber cuántos meses cubre.</div>');
  if (p.note) lines.push(`<div>📝 ${esc(p.note)}</div>`);
  const hist = ui.hist[p.id] ? `<div class="hist">${p.tx.length ? `<table><thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Monto</th><th></th></tr></thead><tbody>${[...p.tx].sort((a,b) => b.date.localeCompare(a.date)).map(t => `<tr><td>${dShort(t.date)}</td><td>${t.opening ? 'Saldo inicial' : t.amount > 0 ? 'Aporte' : 'Retiro'}${t.ext && !t.opening ? ' <span class="tag">externo</span>' : ''}<div style="color:var(--muted)">${esc(t.note && !t.opening ? t.note : '')}</div></td><td class="r ${t.amount > 0 ? 'pos' : 'neg'}">${t.amount > 0 ? '+' : '−'} ${money(Math.abs(t.amount)).replace('− ','')}</td><td class="act"><button class="ico-btn" data-a="deltx" data-c="pots" data-p="${p.id}" data-id="${t.id}">✕</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Sin movimientos</div>'}</div>` : '';
  return `<div class="card pot ${i.done ? 'done' : ''}">
    <div class="ph"><div class="ic" style="background:${p.color}26">${p.icon}</div><div class="pt"><h4>${esc(p.name)}</h4><div class="sub">${sub}</div></div><div>${delBtn('pots', p.id)}</div></div>
    <div class="bal">${money(i.bal)}</div>
    <div class="of">${tgt ? `de ${money(p.target)} · ${i.pct.toFixed(0)}%` : 'Sin tope · tú decides cuánto guardar'}</div>
    ${tgt ? `<div class="progress ${i.done ? 'green' : ''}"><div style="width:${i.pct}%;${i.done ? '' : 'background:' + p.color}"></div></div>` : ''}
    ${lines.length ? `<div class="pinfo">${lines.join('')}</div>` : ''}
    <div class="btns"><button class="btn btn-primary btn-sm" data-a="potmove" data-id="${p.id}" data-sign="1">+ Aportar</button><button class="btn btn-soft btn-sm" data-a="potmove" data-id="${p.id}" data-sign="-1" ${i.bal > 0 ? '' : 'disabled'}>Retirar</button><button class="btn btn-soft btn-sm" data-a="hist" data-id="${p.id}">${ui.hist[p.id] ? 'Ocultar historial' : 'Historial (' + p.tx.length + ')'}</button></div>
    ${hist}</div>`;
}

function vPots(kind){
  const isMeta = kind === 'meta', mk = ui.month;
  const list = S.pots.filter(p => p.kind === kind);
  const infos = list.map(p => ({p, i:potInfo(p)}));
  const act = infos.filter(x => !x.i.done), dn = infos.filter(x => x.i.done);
  const saved = sum(infos, x => x.i.bal);
  const monthNet = sum(list, p => sum(p.tx.filter(t => !t.opening && t.date.slice(0,7) === mk), t => t.amount));
  const hist = []; for (let i = 5; i >= 0; i--) hist.push(shift(mk, -i));
  const flow = hist.map(m => ({
    in:sum(list, p => sum(p.tx.filter(t => !t.opening && t.date.slice(0,7) === m && t.amount > 0), t => t.amount)),
    out:sum(list, p => sum(p.tx.filter(t => !t.opening && t.date.slice(0,7) === m && t.amount < 0), t => -t.amount))}));
  const tgtTotal = sum(infos.filter(x => x.i.tgt > 0), x => x.i.tgt);
  const progress = tgtTotal ? sum(infos.filter(x => x.i.tgt > 0), x => Math.min(x.i.bal, x.i.tgt)) / tgtTotal * 100 : 0;
  const avg = avgExpense(), eb = emergencyBal(), hasE = S.pots.some(isEmergency);
  const kpis = isMeta ? `
    ${kpi('Ahorrado en metas', money(saved), `${list.length} meta(s)`, 'neu')}
    ${kpi('Objetivo total', money(tgtTotal), 'Suma de todas tus metas')}
    ${kpi('Avance global', progress.toFixed(0) + '%', '', progress >= 100 ? 'pos' : '')}
    ${kpi('Completadas', `${dn.length} de ${list.length}`, 'Se conservan en tu lista', dn.length ? 'pos' : '')}
    ${kpi('Neto de ' + monthName(mk, true), money(monthNet), 'Aportes − retiros del mes', monthNet < 0 ? 'neg' : '')}` : `
    ${kpi('Total en bolsillos', money(saved), `${list.length} bolsillo(s)`, 'neu')}
    ${kpi('Neto de ' + monthName(mk, true), money(monthNet), 'Aportes − retiros del mes', monthNet < 0 ? 'neg' : '')}
    ${kpi('Gasto mensual promedio', money(avg), 'Gastos + fijos + cuotas (3 meses)')}
    ${kpi('Cobertura de emergencia', hasE && avg > 0 ? dec1(eb / avg) + ' meses' : '—', hasE ? 'Meta: 3 a 6 meses' : 'Aún sin bolsillo 🛟', hasE && avg > 0 && eb / avg >= 3 ? 'pos' : '')}`;
  const banner = isMeta ? '' : `<div class="card" style="margin-bottom:16px"><h3>🛟 Fondo de emergencia <span>Referencia: 3 meses (ingreso estable) · 6 meses (ingreso variable)</span></h3>
    ${avg > 0 ? `<p class="note" style="margin:0 0 10px">Con tus gastos promedio de <b>${money(avg)}</b> al mes, el fondo sugerido es de <b>${money(avg*3)}</b> (3 meses) a <b>${money(avg*6)}</b> (6 meses, lo más prudente si tus ingresos varían, como repartidor o independiente). Guárdalo donde puedas sacarlo el mismo día: cuenta de ahorros o fondo de liquidez, no un CDT largo ni bolsa.</p>
    ${hasE ? `<div class="plabel"><span>Tu fondo cubre ${dec1(eb / avg)} de 6 meses</span><b>${Math.min(100, eb / (avg*6) * 100).toFixed(0)}%</b></div><div class="progress ${eb / avg >= 3 ? 'green' : ''}"><div style="width:${Math.min(100, eb / (avg*6) * 100)}%"></div></div>` : `<button class="btn btn-primary btn-sm" data-a="addpot" data-kind="bolsillo" data-tpl="0">Crear bolsillo de emergencia</button>`}`
    : `<p class="note" style="margin:0">Registra tus gastos del mes y calcularé cuánto necesitas para cubrir 3 a 6 meses.</p>`}</div>`;
  const tplBtns = TEMPLATES[kind].map((t, i) => `<button class="tchip" data-a="addpot" data-kind="${kind}" data-tpl="${i}">${t[0]} ${esc(t[1])}</button>`).join(' ');
  const empty = `<div class="card"><div class="empty"><b>${isMeta ? 'Aún no tienes metas' : 'Aún no tienes bolsillos'}</b>${isMeta ? 'Un viaje, una moto, tus estudios… define cuánto necesitas y ve apartando.' : 'Apartar dinero por propósito: emergencias, gastos de la semana, imprevistos.'}<div class="tchips" style="justify-content:center;margin:14px 0 0">${tplBtns}</div></div></div>`;
  return `
  <div class="grid g5">${kpis}</div>
  ${banner}
  ${list.length ? `<div class="card" style="margin-bottom:16px"><h3>Aportes y retiros <span>Últimos 6 meses</span></h3>${barChart({labels:hist.map(m => monthName(m, true)), series:[{name:'Aportes', color:'#30b455', values:flow.map(x => x.in)},{name:'Retiros', color:'#ff9f0a', values:flow.map(x => x.out)}], h:180})}<div class="key"><span><i style="background:#30b455"></i>Aportes</span><span><i style="background:#ff9f0a"></i>Retiros</span></div></div>` : ''}
  <div class="sec-head"><h3>${isMeta ? 'En progreso' : 'Mis bolsillos'}</h3><button class="btn btn-primary btn-sm" data-a="addpot" data-kind="${kind}">${isMeta ? '+ Nueva meta' : '+ Nuevo bolsillo'}</button></div>
  ${list.length ? (act.length ? `<div class="pots">${act.map(potCard).join('')}</div>` : `<div class="card" style="margin-bottom:20px">${emptyBox('Todas tus metas están completadas 🎉', 'Crea una nueva cuando quieras.')}</div>`) : empty}
  ${isMeta && dn.length ? `<div class="sec-head"><h3>🏆 Completadas</h3><span class="note">Se quedan aquí hasta que las elimines.</span></div><div class="pots">${dn.map(potCard).join('')}</div>` : ''}`;
}

/* ----- Patrimonio (Fase 7) ----- */
function vPatrimonio(){
  const k = ui.month, asOf = asOfOf(k), nw = networth(k), PF = portfolioAt(asOf), cur = k === todayKey;
  const neg = x => x ? '− ' + money(x).replace('− ', '') : money(0);
  const flags = [];
  if (PF.nNoVal) flags.push(['', `${PF.nNoVal} inversión(es) sin valoración registrada: se cuentan al capital aportado neto, no a precio de mercado, y no tienen rentabilidad calculable.`]);
  if (PF.nStale) flags.push(['', `${PF.nStale} inversión(es) con valor registrado hace más de ${STALE_DAYS} días o con TRM desactualizada.`]);
  if (PF.trm.hasUSD && !PF.trm.set) flags.push(['', 'Tienes dólares sin TRM definida: se valoran a tu tasa de compra. Defínela en Inversiones.']);
  if (PF.trm.hasUSD && PF.trm.set && !PF.trm.date) flags.push(['', 'La TRM registrada no tiene fecha: no se sabe qué tan vigente es.']);
  if (PF.trm.hasUSD && k < todayKey) flags.push(['info', 'Mes pasado: los dólares se convierten con la TRM registrada hoy, no con la de ese mes.']);
  if (k > todayKey) flags.push(['info', 'Mes futuro: proyección con los datos registrados; las valoraciones manuales no se proyectan.']);
  const assetItems = [
    ...(nw.disp > 0 ? [{label:'Efectivo disponible', value:nw.disp, color:'#5e5ce6'}] : []),
    ...(nw.metas > 0 ? [{label:'Metas', value:nw.metas, color:'#30b455'}] : []),
    ...(nw.bols > 0 ? [{label:'Bolsillos', value:nw.bols, color:'#32ade6'}] : []),
    ...PF.byType.map(x => ({label:x.label, value:x.value, color:x.color}))];
  const trmTxt = r => r.i.isUSD ? `${usd(r.i.units)}<small>TRM ${r.i.trm ? money(r.i.trm) : '—'} · ${r.m.trm.set ? 'manual' + (r.m.trm.date ? ', ' + dShort(r.m.trm.date) : ', sin fecha') : 'implícita (compra)'}${r.m.trm.stale ? ' ⚠' : ''}</small>` : 'COP<small>sin conversión</small>';
  const srcTxt = r => r.m.kind === 'accrual' ? 'Estimado con tu tasa<small>no es cotización</small>'
    : r.m.kind === 'cost' ? '<span class="pill warn">Sin valoración</span><small>a capital aportado</small>'
    : r.m.kind === 'fx' ? `Cantidad exacta<small>TRM ${r.m.trm.date ? dShort(r.m.trm.date) + ' (' + ageText(r.m.trm.age) + ')' : r.m.trm.set ? 'sin fecha' : 'sin definir'}${r.m.stale ? ' ⚠' : ''}</small>`
    : `${dShort(r.m.date)}<small>${ageText(r.m.age)}${r.m.stale ? ' · <b style="color:#d98200">desactualizado</b>' : ''}</small>`;
  const body = [...PF.rows.filter(r => !r.i.closed), ...PF.rows.filter(r => r.i.closed)].map(r => {
    const g = r.rz.gainOk ? `<span class="${r.i.gain > 0.5 ? 'pos' : r.i.gain < -0.5 ? 'neg' : ''}">${sg(r.i.gain)}</span><small>${r.i.pct > 0 ? '+' : ''}${r.i.pct.toFixed(1).replace('.', ',')}%</small>` : '<span style="color:var(--muted)">No calculable</span><small>sin valoración</small>';
    const z = !r.rz.gainOk ? '—' : r.rz.rzOk ? `${sg(r.rz.realized)}<small>no realizada ${sg(r.rz.unrealized)}</small>` : `<span style="color:var(--muted)">No calculable</span><small>${esc(r.rz.why)}</small>`;
    return `<tr class="${r.i.closed ? 'cl' : ''}"><td><b>${esc(r.h.name)}</b>${r.i.closed ? ' <span class="pill ok">Cerrada</span>' : ''}<small>${esc((ITYPES[r.h.type] || ITYPES.otro)[0])}${r.h.platform ? ' · ' + esc(r.h.platform) : ''}</small></td>
      <td>${trmTxt(r)}</td><td>${money(r.i.contributed)}${r.i.withdrawn ? `<small>retirado ${money(r.i.withdrawn)}</small>` : ''}</td><td><b>${money(r.i.value)}</b></td><td>${g}</td><td>${z}</td><td>${srcTxt(r)}</td></tr>`;
  }).join('');
  const rzAll = PF.nRz === PF.nCalc && PF.nRz > 0;
  const tot = PF.rows.length ? `<tr class="tot"><td>Total${PF.nCalc < PF.rows.length ? '<small>ganancia solo de las que tienen valoración</small>' : ''}</td><td></td><td>${money(PF.contributed)}${PF.withdrawn ? `<small>retirado ${money(PF.withdrawn)}</small>` : ''}</td><td>${money(PF.value)}</td>
      <td>${PF.nCalc ? sg(PF.gain) + `<small>${PF.pct > 0 ? '+' : ''}${PF.pct.toFixed(1).replace('.', ',')}%</small>` : '—'}</td><td>${PF.nRz ? sg(PF.realized) + `<small>no realizada ${sg(PF.unrealized)}${rzAll ? '' : ' · parcial'}</small>` : '—'}</td><td></td></tr>` : '';
  const usdLine = PF.trm.hasUSD ? `<div class="kv"><span>En dólares (moneda original)</span><b>${usd(PF.usdUnits)} ≈ ${money(PF.usdValue)}</b></div>` : '';
  return `
  ${flags.length ? `<div class="pflags">${flags.map(f => `<div class="pflag ${f[0]}">${f[1]}</div>`).join('')}</div>` : ''}
  <div class="grid g5">
    ${kpi('Efectivo disponible', money(nw.disp), 'Saldo del mes, sin ahorros ni inversiones', nw.disp < 0 ? 'neg' : '')}
    ${kpi('Ahorros en metas', money(nw.metas), `Bolsillos aparte: ${money(nw.bols)}`)}
    ${kpi('Inversiones (valor registrado)', money(nw.inv), S.invest.length ? `${PF.nActive} activa(s) · capital neto ${money(PF.net)}` : 'Sin inversiones')}
    ${kpi('Deudas pendientes', neg(nw.debt), 'Solo capital, sin intereses futuros', nw.debt > 0 ? 'neg' : '')}
    ${kpi('Patrimonio neto estimado', money(nw.total), `Activos − pasivos${cur ? ', a hoy' : ', al cierre de ' + monthName(k, true)}`, nw.total < 0 ? 'neg' : 'pos')}
  </div>
  <div class="grid g2">
    <div class="card"><h3>Cómo se compone <span>${esc(monthName(k))}</span></h3><div class="eq">
      <div class="sub">Activos contabilizados</div>
      <div class="kv"><span>Efectivo disponible</span><b class="${nw.disp < 0 ? 'neg' : ''}">${money(nw.disp)}</b></div>
      <div class="kv"><span>Metas</span><b>${money(nw.metas)}</b></div>
      <div class="kv"><span>Bolsillos</span><b>${money(nw.bols)}</b></div>
      <div class="kv"><span>Inversiones (valor registrado)</span><b>${money(nw.inv)}</b></div>
      <div class="kv tot"><span>Total activos</span><b>${money(nw.assets)}</b></div>
      <div class="sub">Pasivos contabilizados</div>
      <div class="kv"><span>Préstamos (capital pendiente)</span><b class="neg">${neg(nw.debt)}</b></div>
      <div class="kv tot"><span>Patrimonio neto estimado</span><b class="${nw.total < 0 ? 'neg' : ''}">${money(nw.total)}</b></div></div>
      <p class="note" style="margin:10px 0 0">Cada peso se cuenta una sola vez: lo que aportas a una meta o inversión sale de tu efectivo y pasa a ese activo.</p></div>
    <div class="card"><h3>¿De qué está hecho tu patrimonio? <span>Activos</span></h3>${assetItems.length ? donut(assetItems, money(sum(assetItems, x => x.value)).replace('$ ', '$'), 'en activos') : emptyBox('Sin activos positivos', 'Aún no hay efectivo, ahorros ni inversiones con saldo.')}
      ${nw.disp < 0 ? '<p class="note" style="margin:10px 0 0">Tu efectivo es negativo: no aparece en el gráfico, pero sí se resta del patrimonio.</p>' : ''}</div>
  </div>
  <div class="card" style="margin-bottom:16px"><h3>Inversiones: aportado vs. valor registrado <span>${cur ? 'A hoy' : 'Al cierre de ' + esc(monthName(k, true))}</span></h3>
    ${PF.rows.length ? `<div style="overflow-x:auto"><table class="ptbl"><thead><tr><th>Inversión</th><th>Moneda original y tasa</th><th>Capital aportado</th><th>Valor registrado (COP)</th><th>Ganancia / pérdida</th><th>Realizada</th><th>Valor al</th></tr></thead><tbody>${body}${tot}</tbody></table></div>
    <div class="grid g2" style="margin-top:14px">
      <div><h5 style="margin:0 0 6px">Por tipo de inversión</h5>${PF.byType.length ? donut(PF.byType.map(x => ({label:x.label, value:x.value, color:x.color})), money(sum(PF.byType, x => x.value)).replace('$ ', '$'), 'invertido') : '<div class="empty">Sin inversiones activas</div>'}</div>
      <div><h5 style="margin:0 0 6px">Por moneda</h5><div class="kv"><span>En pesos (COP)</span><b>${money(PF.value - PF.usdValue)}</b></div>${usdLine || '<div class="kv"><span>En dólares</span><b>—</b></div>'}</div></div>`
    : emptyBox('Sin inversiones registradas', 'Agrega tus inversiones para ver su composición y rentabilidad.')}</div>
  <details class="card"><summary>Fórmulas y límites de estos cálculos</summary><div class="body">
    <ul><li><b>Patrimonio neto estimado</b> = efectivo + metas + bolsillos + valor registrado de inversiones − capital pendiente de préstamos.</li>
    <li><b>Deudas:</b> solo el capital pendiente; los intereses y seguros futuros no se cuentan hasta que se paguen.</li>
    <li><b>Ganancia total</b> = valor registrado + retirado − aportado. Un retiro solo devuelve capital: no suma como rendimiento.</li>
    <li><b>Realizada / no realizada</b> (costo promedio): cada retiro saca del costo la fracción retirada del valor que tenía la posición. Realizada = retirado − costo sacado; no realizada = valor − costo restante. Solo se calcula si había una valoración antes de cada retiro (CDT y dólares se consideran valorados). En una posición cerrada todo el resultado es realizado.</li>
    <li><b>Sin valoración:</b> la inversión se cuenta al capital aportado neto y no tiene rentabilidad calculable. La app no consulta precios: todo valor manual es el que registraste y se marca como desactualizado después de ${STALE_DAYS} días.</li>
    <li><b>CDT:</b> el valor es un estimado con la tasa que registraste (interés compuesto hasta hoy), no una cotización.</li>
    <li><b>Dólares:</b> valor = dólares × TRM manual. Si no hay TRM se usa tu tasa de compra y no se calcula ganancia. La TRM es única (no hay histórico por fecha), así que en meses pasados se usa la actual.</li>
    <li><b>Límites del historial:</b> no hay lotes ni comisiones; los retiros sin valoración previa y las valoraciones del mismo día de un movimiento se interpretan en el orden en que se registraron.</li></ul></div></details>`;
}

/* ----- Inversiones ----- */
const sg = n => (n > 0.5 ? '+ ' : n < -0.5 ? '− ' : '') + money(Math.abs(n)).replace('− ','');
function valSrc(m){
  if (m.kind === 'accrual') return 'Valor estimado con tu tasa registrada · no es una cotización';
  if (m.kind === 'cost') return '<span class="pill warn">Sin valoración</span> Se muestra el capital aportado, no un precio de mercado';
  if (m.kind === 'fx') return 'Cantidad exacta según tus compras y ventas';
  return `Valor registrado a mano el ${dFull(m.date)} (${ageText(m.age)}) ${m.stale ? '<span class="pill warn">Desactualizado</span>' : ''}`;
}
function invCard({h, i, m, rz}){
  const t = ITYPES[h.type] || ITYPES.otro;
  const gcls = i.gain > 0.5 ? 'pos' : i.gain < -0.5 ? 'neg' : '';
  const gs = i.gain > 0.5 ? '+' : i.gain < -0.5 ? '−' : '';
  let badge = '';
  if (i.closed) badge = '<span class="pill ok">Cerrada</span>';
  else if (h.type === 'cdt' && i.end) badge = i.matured ? '<span class="pill bad">Vencido</span>' : `<span class="pill info">Vence en ${i.daysLeft} d</span>`;
  const cdt = h.type === 'cdt' ? `
    <div class="plabel"><span>Tiempo transcurrido</span><b>${i.elapsed.toFixed(0)}%</b></div><div class="progress"><div style="width:${i.elapsed}%;background:${t[2]}"></div></div>
    <div class="meta"><div><span>Tasa E.A.</span><b>${esc(i.rate)}%</b></div><div><span>Plazo</span><b>${i.term} días</b></div>
    <div><span>Vencimiento</span><b>${i.end ? dFull(i.end) : '—'}</b></div><div><span>Al vencer (bruto)</span><b>${money(i.finalGross)}</b></div>
    <div><span>Neto estimado*</span><b>${money(i.finalNet)}</b></div></div>` : '';
  const usdLine = i.isUSD ? `<div class="of">${usd(i.units)} (moneda original) · TRM ${i.trm ? money(i.trm) : '—'} · ${m.trm.set ? 'manual' + (m.trm.date ? ', ' + dFull(m.trm.date) + ' (' + ageText(m.trm.age) + ')' : ', sin fecha') + (m.trm.stale ? ' <span class="pill warn">TRM desactualizada</span>' : '') : 'implícita (tu tasa de compra); define la TRM'}</div>` : '';
  const gainLine = rz.gainOk
    ? `<div class="of">Aportado ${money(i.net)} · <b class="${gcls}">${gs} ${money(Math.abs(i.gain)).replace('− ','')} (${gs}${Math.abs(i.pct).toFixed(1).replace('.',',')}%)</b></div>`
    : `<div class="of">Aportado ${money(i.net)} · <b>Rentabilidad no calculable sin valoración</b></div>`;
  const rzLine = !rz.gainOk ? '' : i.closed ? `<div class="of">Resultado realizado (posición cerrada): <b>${sg(rz.realized)}</b></div>`
    : rz.rzOk ? `<div class="of">Realizada <b>${sg(rz.realized)}</b> · No realizada <b>${sg(rz.unrealized)}</b></div>` : `<div class="of">Realizada / no realizada: no calculable</div>`;
  const hist = ui.hist[h.id] ? `<div class="hist">${h.tx.length ? `<table><thead><tr><th>Fecha</th><th>Movimiento</th><th class="r">Monto</th><th></th></tr></thead><tbody>${[...h.tx].sort((a,b) => b.date.localeCompare(a.date)).map(x => `<tr><td>${dShort(x.date)}</td><td>${x.op === 'aporte' ? 'Aporte' : x.op === 'retiro' ? 'Retiro' : 'Valor'}${x.ext ? ' <span class="tag">externo</span>' : ''}<div style="color:var(--muted)">${esc(x.note)}</div></td><td class="r">${x.op === 'valor' ? (h.currency === 'USD' ? usd(x.value) : money(x.value)) : money(x.amount) + (x.usd ? '<div style="color:var(--muted)">' + usd(x.usd) + '</div>' : '')}</td><td class="act"><button class="ico-btn" data-a="deltx" data-c="invest" data-p="${h.id}" data-id="${x.id}">✕</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Sin movimientos</div>'}</div>` : '';
  return `<div class="card pot ${i.closed ? 'closed' : ''}">
    <div class="ph"><div class="ic" style="background:${t[2]}26">${t[1]}</div><div class="pt"><h4>${esc(h.name)}</h4><div class="sub">${esc(t[0])}${h.platform ? ' · ' + esc(h.platform) : ''}</div>${badge ? `<div style="margin-top:6px">${badge}</div>` : ''}</div><div>${delBtn('invest', h.id)}</div></div>
    <div class="bal">${money(i.value)}</div>
    ${usdLine}
    ${gainLine}${rzLine}
    <div class="of">${valSrc(m)}</div>
    ${cdt}
    ${h.note ? `<div class="pinfo"><div>📝 ${esc(h.note)}</div></div>` : ''}
    <div class="btns">${h.type === 'cdt' ? '' : `<button class="btn btn-primary btn-sm" data-a="invtx" data-id="${h.id}" data-op="aporte">+ Aportar</button>`}<button class="btn btn-soft btn-sm" data-a="invtx" data-id="${h.id}" data-op="retiro">${h.type === 'cdt' ? 'Redimir' : 'Retirar'}</button>${h.type === 'cdt' ? '' : `<button class="btn btn-soft btn-sm" data-a="invtx" data-id="${h.id}" data-op="valor">Actualizar valor</button>`}<button class="btn btn-soft btn-sm" data-a="hist" data-id="${h.id}">${ui.hist[h.id] ? 'Ocultar historial' : 'Historial (' + h.tx.length + ')'}</button></div>
    ${hist}</div>`;
}

function insights(infos){
  const out = [], avg = avgExpense(), eb = emergencyBal(), hasE = S.pots.some(isEmergency);
  const act = infos.filter(x => !x.i.closed), total = sum(act, x => x.i.value);
  if (!hasE) out.push(['⚠️', 'Aún no tienes un fondo de emergencia. Crea un bolsillo 🛟 antes de aumentar tus inversiones, sobre todo en renta variable.']);
  else if (avg > 0){ const m = eb / avg; out.push(m < 3 ? ['⚠️', `Tu fondo de emergencia cubre ${dec1(m)} meses. El mínimo recomendado es 3 (6 si tus ingresos son variables).`] : ['✅', `Tu fondo de emergencia cubre ${dec1(m)} meses de gastos.`]); }
  else out.push(['ℹ️', 'Registra tus gastos para calcular cuántos meses cubre tu fondo de emergencia.']);
  if (act.length > 1 && total > 0){ const top = act.reduce((a, x) => x.i.value > a.i.value ? x : a); const sh = top.i.value / total * 100; if (sh > 50) out.push(['⚠️', `“${top.h.name}” concentra el ${sh.toFixed(0)}% de tu portafolio. Diversificar reduce el riesgo.`]); }
  act.filter(x => x.h.type === 'cdt' && x.i.end).forEach(x => {
    if (x.i.matured) out.push(['⚠️', `El CDT “${x.h.name}” ya venció: redímelo o renuévalo para que no quede sin rendir.`]);
    else if (x.i.daysLeft <= 30) out.push(['ℹ️', `El CDT “${x.h.name}” vence en ${x.i.daysLeft} días.`]);
  });
  if (act.some(x => x.i.isUSD) && !(S.settings.trm > 0)) out.push(['ℹ️', 'Tienes inversiones en dólares: define la TRM para ver su valor real en pesos.']);
  else if (act.some(x => x.i.isUSD) && act[0] && S.settings.trm > 0 && act.find(x => x.i.isUSD).m.trm.stale) out.push(['⚠️', `La TRM registrada está desactualizada o no tiene fecha (límite ${STALE_DAYS} días): actualízala para valorar tus dólares.`]);
  const nv = act.filter(x => x.m.kind === 'cost').length, st = act.filter(x => x.m.stale).length;
  if (nv) out.push(['ℹ️', `${nv} inversión(es) sin valoración registrada: se muestran al capital aportado. Usa «Actualizar valor» para ver su rentabilidad.`]);
  if (st) out.push(['⚠️', `${st} inversión(es) con valor registrado hace más de ${STALE_DAYS} días: actualízalo antes de tomar decisiones.`]);
  const rv = sum(act.filter(x => x.h.type === 'bolsa'), x => x.i.value);
  if (total > 0 && rv / total > 0.3) out.push(['ℹ️', `La renta variable pesa el ${(rv / total * 100).toFixed(0)}% de tu portafolio. Úsala solo con dinero que no necesites en menos de 1 año.`]);
  if (!infos.length) out.push(['ℹ️', 'Empieza simple: fondo de emergencia primero, luego liquidez o CDT para metas cortas y, solo después, renta variable para largo plazo.']);
  return out;
}

/* ---------- Nube: Firestore automático (sin inicio de sesión, sin clave) ----------
   Un único documento fijo (finanzas/principal) guarda todo. Al abrir la página se conecta solo.
   No se escribe nada hasta haber leído la nube con éxito, así nunca se pisa lo guardado. */
const FB_CONFIG = {
  apiKey: "AIzaSyBbyPhZv_a7NkPgAbyzqIMZVRwtkStaF3w",
  authDomain: "finanzasortegon.firebaseapp.com",
  projectId: "finanzasortegon",
  storageBucket: "finanzasortegon.firebasestorage.app",
  messagingSenderId: "1098750145410",
  appId: "1:1098750145410:web:741787dba565ff1e7c159b"
};
const FB_VER = '11.9.0'; /* misma versión que la web que ya te conectaba bien */
const DOC_COL = 'finanzas', DOC_ID = 'principal', BK_ID = 'respaldo';
const MIGRATED = 'finanzas.pc.migrado'; /* solo marca: los datos ya no se guardan en el navegador */
const hasData = d => !!(d.extras.length || d.rides.length || d.expenses.length || d.fixed.length || d.loans.length || d.pots.length || d.invest.length || d.brokers.length || Object.keys(d.months).length || Object.keys(d.fixedPaid).length || d.settings.trm > 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const why = e => { const c = (e && (e.code || e.message)) || ''; console.warn('[nube]', e);
  if (/permission/i.test(c)) return 'Permiso denegado: publica las reglas de Firestore (ver guía)';
  if (/not-found|failed-precondition/i.test(c)) return 'No se encontró la base de datos de Firestore';
  if (/api.?key|invalid-argument|unauthenticated/i.test(c)) return 'La configuración de Firebase no es válida';
  if (/timeout|unavailable|offline|network|fetch|import|module/i.test(c)) return 'Sin conexión · reintentando…';
  return 'Error: ' + String(c).slice(0, 80); };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

/* Adaptador de Firestore. El resto del código solo conoce esta interfaz. */
function firebaseBackend(){
  let mods = null;
  const load = async () => {
    if (mods) return mods;
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [app, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
    return (mods = { fs, db:fs.getFirestore(app.initializeApp(FB_CONFIG)) });
  };
  const ref = (m, id) => m.fs.doc(m.db, DOC_COL, id || DOC_ID);
  return {
    async ready(){ await load(); },
    /* lectura siempre desde el servidor (nunca una copia vieja) */
    async read(){ const m = await load(), sn = await m.fs.getDoc(ref(m)); return sn.exists() ? sn.data() : null; },
    /* igual que la web que ya te funcionaba: getDoc + setDoc, sin transacciones.
       expected = updatedAt que vimos por última vez (0 si ninguno) */
    async write(data, expected){
      const m = await load(), r = ref(m), sn = await m.fs.getDoc(r), cur = sn.exists() ? sn.data() : null, curTs = cur ? (cur.updatedAt || 0) : 0;
      if (curTs !== expected) return { conflict:true, remote:cur };
      const now = Date.now(), ts = Math.max(now, curTs + 1);
      /* copia del estado anterior, como máximo una vez cada ~20 h (si falla, no afecta al guardado) */
      if (cur && cur.data){
        try { const rb = ref(m, BK_ID), bs = await m.fs.getDoc(rb); if (!bs.exists() || now - (bs.data().at || 0) > 72e6) await m.fs.setDoc(rb, { data:cur.data, at:now, of:curTs, v:3 }); } catch(e){}
      }
      await m.fs.setDoc(r, { data, updatedAt:ts, v:3 });
      return { ok:true, ts };
    },
    async listen(cb){ const m = await load(); return m.fs.onSnapshot(ref(m), sn => { if (!sn.metadata.hasPendingWrites && !sn.metadata.fromCache) cb(sn.exists() ? sn.data() : null); }, () => {}); },
  };
}

/* Aviso inferior ("Conectando…") */
let connT = null;
function pill(msg, mode){
  const c = $('conn'); if (!c) return; clearTimeout(connT);
  c.querySelector('span').textContent = msg;
  c.className = 'conn show' + (mode ? ' ' + mode : '');
}
const pillHide = delay => { clearTimeout(connT); connT = setTimeout(() => { const c = $('conn'); if (c) c.classList.remove('show'); }, delay || 0); };

const cloud = {
  be:null, ready:false, last:0, dirty:false, busy:false, again:false, timer:null, unsub:null,
  mark(){ this.dirty = true; if (this.ready) this.schedule(); },
  schedule(){ clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 450); },
  async push(){
    if (!this.ready) return;
    if (this.busy){ this.again = true; return; }
    this.busy = true; clearTimeout(this.timer);
    try {
      const json = JSON.stringify(S), r = await this.be.write(json, this.last);
      if (r.conflict){ this.adopt(r.remote, 'Otro dispositivo guardó al mismo tiempo: se cargó lo más reciente. Revisa tu último cambio.'); }
      else { this.last = r.ts; if (json === JSON.stringify(S)) this.dirty = false; if ($('conn').classList.contains('warn')) { pill('✓ Guardado', 'done'); pillHide(1400); } }
    } catch(e){ const m = why(e); pill(/reintentando/.test(m) ? 'Sin conexión: se guardará al volver' : m, 'warn'); clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 4000); }
    finally { this.busy = false; if (this.again){ this.again = false; this.schedule(); } }
  },
  adopt(raw, msg){
    let d; try { d = normalize(JSON.parse(raw.data)); } catch(e){ toast('Los datos de la nube no se pudieron leer'); return false; }
    S = d; this.last = raw.updatedAt; this.dirty = false; render(); if (msg) toast(msg); return true;
  },
  async start(){
    let tries = 0, raw = null;
    pill('Conectando…');
    for (;;){
      try {
        this.be = window.__FINANZAS_BACKEND || firebaseBackend();
        await withTimeout(this.be.ready(), 15000);
        raw = await withTimeout(this.be.read(), 15000);
        break;
      } catch(e){ tries++; const m = why(e), det = (e && (e.code || e.message) || '').toString().slice(0, 60); if (tries > 1 || !/reintentando/.test(m)) pill(m + (det ? ' [' + det + ']' : ''), 'warn'); await sleep(/Permiso|configuración|base de datos/.test(m) ? 6000 : 2500); }
    }
    let migrated = false;
    if (raw){
      try { S = normalize(JSON.parse(raw.data)); this.last = raw.updatedAt; }
      catch(e){ pill('Los datos de la nube no se pudieron leer. No se modificó nada.', 'warn'); return; }
    } else {
      /* nube vacía: una sola vez, sube lo que haya en este navegador (versión anterior del archivo) */
      let flag = null; try { flag = localStorage.getItem(MIGRATED); } catch(e){}
      if (!flag){
        try { const old = normalize(JSON.parse(localStorage.getItem(KEY))); if (hasData(old)){ S = old; migrated = true; } } catch(e){}
      }
      this.last = 0;
    }
    this.ready = true;
    $('layout').classList.remove('boot'); render();
    pill('✓ Conectado', 'done'); pillHide(1300);
    if (migrated){ this.dirty = true; await this.push(); if (!this.dirty){ try { localStorage.setItem(MIGRATED, '1'); } catch(e){} toast('Tus datos se subieron a la nube'); } }
    try {
      this.unsub = await this.be.listen(raw2 => {
        if (!raw2 || raw2.updatedAt <= this.last || this.dirty || this.busy) return;
        if (this.adopt(raw2)) toast('Actualizado desde otro dispositivo');
      });
    } catch(e){}
  },
};
window.addEventListener('online', () => { if (cloud.ready && cloud.dirty) cloud.schedule(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && cloud.ready && cloud.dirty) cloud.push(); });
window.addEventListener('beforeunload', e => { if (cloud.ready && (cloud.dirty || cloud.busy)){ e.preventDefault(); e.returnValue = ''; } });

cloud.start();
})();
